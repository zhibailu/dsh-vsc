      });
      cust.addEventListener("keydown", function (e) {
        if (e.key === "ArrowUp" && custHistory.length > 0) {
          e.preventDefault();
          if (custHistoryIndex === -1) { custHistoryDraft = cust.value; custHistoryIndex = 0; }
          else custHistoryIndex = Math.min(custHistoryIndex + 1, custHistory.length - 1);
          applyCustom(custHistory[custHistory.length - 1 - custHistoryIndex]);
          return;
        }
        if (e.key === "ArrowDown") {
          if (custHistoryIndex === -1) return; // not navigating yet
          e.preventDefault();
          custHistoryIndex--;
          applyCustom(custHistoryIndex === -1 ? custHistoryDraft : custHistory[custHistory.length - 1 - custHistoryIndex]);
          return;
        }
        if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
          e.preventDefault();
          rememberCustom();
          answerInteraction({ submit: true });
        }
      });
    }
    updateInteractionButtons();
  }
  function answerInteraction(ans) {
    var st = interactState;
    if (!st) return;
    if (ans.outcome) {
      post({ type: "respondApproval", rpcId: st.rpcId, sessionId: st.sessionId, approvalId: st.approvalId, outcome: ans.outcome });
    } else if (ans.submit) {
      var answers = [];
      // build from the message's questions (keep original order)
      var qs = state.interact && state.interact.questions || [];
      qs.forEach(function (q, qi) {
        // skipped question: empty answer (web composer sends {id, selected:[]})
        if (st.skipped && st.skipped[qi]) {
          answers.push({ id: q.id, selected: [] });
          return;
        }
        var selSet = st.selections[qi];
        var selected = selSet ? Array.from(selSet).map(function (oi) {
          var o = q.options[Number(oi)];
          return o ? o.label : "";
        }).filter(Boolean) : [];
        var custom = (st.custom || "").trim();
        // Web composer semantics: on a single-select, a custom answer REPLACES
        // the picked option (selected:[], custom); multi-select keeps both.
        if (custom !== "" && q.multiSelect !== true) selected = [];
        if (selected.length || custom) answers.push({ id: q.id, selected: selected, ...(custom ? { custom } : {}) });
      });
      post({ type: "respondQuestion", rpcId: st.rpcId, sessionId: st.sessionId, answers: answers });
    }
    state.interact = null;
    interactEl.hidden = true;
    interactState = null;
    unlockMainInput(); // composer released
  }

  /* ---------- metrics line under the input (mirrors the DSH web StatsLine) ---------- */
  // Compact duration: 45.2s under a minute, 2m42s from there on.
  function fmtDur(ms) {
    var s = (ms || 0) / 1e3;
    if (s < 60) return (Math.round(s * 10) / 10) + "s";
    var whole = Math.round(s);
    return Math.floor(whole / 60) + "m" + (whole % 60) + "s";
  }
  // Compact token count: 517 / 12.2K / 517K / 1.2M (one decimal under three digits).
  function fmtTok(n) {
    var scaled = function (v) { return v >= 100 ? String(Math.round(v)) : String(Math.round(v * 10) / 10); };
    if (n < 1e3) return String(n);
    if (n < 1e6) return scaled(n / 1e3) + "K";
    return scaled(n / 1e6) + "M";
  }
  // Tokens/sec: whole tokens from ten up, one decimal below.
  function fmtTps(tps) {
    var c = Math.max(0, tps);
    return c >= 10 ? String(Math.round(c)) : String(Math.round(c * 10) / 10);
  }
  function updateStatusLine() {
    if (!state.connected) { statusEl.textContent = ""; return; }
    var groups = [];
    var act = state.sessions.find(function (x) { return x.sessionId === state.activeSessionId; });
    var ring = "";
    var ctx = act && act.context;
    if (ctx && typeof ctx.contextWindow === "number") {
      var used = ctx.projectedTokens != null ? ctx.projectedTokens : ctx.pressureTokens;
      if (typeof used === "number") {
        var pct = Math.min(100, Math.round((used / ctx.contextWindow) * 100));
        var R = 5, C = 2 * Math.PI * R;
        var frac = Math.max(0.02, pct / 100);
        var col = pct >= 90 ? "var(--err)" : pct >= 70 ? "#e0b94a" : "var(--ok)";
        ring = "<span title='上下文占用 ~" + fmtTok(used) + " / " + fmtTok(ctx.contextWindow) + " tok' style='white-space:nowrap;vertical-align:middle'>" +
          "<svg width='13' height='13' viewBox='0 0 14 14' style='vertical-align:-2px;margin-right:3px'>" +
          "<circle cx='7' cy='7' r='" + R + "' fill='none' stroke='var(--border)' stroke-width='2'/>" +
          "<circle cx='7' cy='7' r='" + R + "' fill='none' stroke='" + col + "' stroke-width='2' stroke-linecap='round' " +
          "stroke-dasharray='" + (frac * C).toFixed(2) + " " + C.toFixed(2) + "' transform='rotate(-90 7 7)'/>" +
          "</svg>" + pct + "%</span>";
      }
    }
    var st = act && act.stats;
    if (st && st.steps > 0) {
      groups.push((st.turns || 0) + " 轮 · " + st.steps + " 步");
      var durations = [];
      if (st.llmMs > 0) durations.push("LLM " + fmtDur(st.llmMs));
      if (st.toolMs > 0) durations.push("工具调用 " + fmtDur(st.toolMs));
      if (durations.length > 0) groups.push(durations.join(" · "));
      var speeds = [];
      if (st.ttftSteps > 0) speeds.push("首 token 平均 " + fmtDur(st.ttftMs / st.ttftSteps));
      if (st.decodeMs > 0) speeds.push(fmtTps(st.decodeTokens / (st.decodeMs / 1e3)) + " tok/s");
      if (speeds.length > 0) groups.push(speeds.join(" · "));
    }
    var u = state.usage;
    if (u) {
      var billed = (u.uncachedInputTokens || 0) + (u.cacheReadTokens || 0) + (u.cacheWriteTokens || 0);
      if (billed > 0 && typeof u.cacheReadTokens === "number") {
        groups.push("缓存命中 " + Math.round((u.cacheReadTokens / billed) * 100) + "%");
      }
      groups.push("输入 " + fmtTok(billed) + " tok · 输出 " + fmtTok(u.outputTokens || 0) + " tok");
    }
    var line = groups.join(" | ");
    var liveHtml = "";
    if (state.running) {
      var live = [];
      // Live task clock (the value that will stay in history as 总计时) plus
      // the running turn's accumulated "+N-M" — both tick/jump without a full
      // rebuild via tickLive().
      var ts = state.turnStartPerf ? Math.max(0, performance.now() - state.turnStartPerf) : 0;
      live.push("<span id='live-status' data-start='" + (state.turnStartPerf || 0) + "'>" + fmtLive(ts) + "</span>");
      var td = turnDiffLive();
      if (td) live.push(diffChipHtml(td));
      if (state.firstTokenAt) {
        live.push("首 token " + ((state.firstTokenAt - state.turnStart) / 1000).toFixed(1) + "s");
        var elapsed = (performance.now() - state.firstTokenAt) / 1000;
        if (elapsed > 0.3 && state.turnOutput > 0) live.push(fmtTps(state.turnOutput / elapsed) + " tok/s");
      }
      liveHtml = live.join(" · ");
    }
    var parts = [];
    if (ring) parts.push(ring);
    if (liveHtml) parts.push(liveHtml);
    if (line) parts.push(esc(line));
    statusEl.innerHTML = parts.join("&nbsp;|&nbsp;");
  }

  /* ---------- input ---------- */
  var history = [], historyIndex = -1, historyDraft = ""; // CLI-style ↑/↓ history
  function autoGrow() {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + "px";
    // The footer grows upward; if the message area was pinned to the bottom,
    // keep it pinned so the newest content (incl. turn summaries) stays visible.
    if (scrollPos()) messagesEl.scrollTop = messagesEl.scrollHeight;
  }
  inputEl.addEventListener("input", function () { autoGrow(); maybeTriggerMention(); });
  inputEl.addEventListener("keydown", function (e) {
    if (menuActive) {
      if (e.key === "ArrowDown") { e.preventDefault(); menuIndex = Math.min(menuIndex + 1, menuItems.length - 1); drawMenu(); return; }
      if (e.key === "ArrowUp") { e.preventDefault(); menuIndex = Math.max(menuIndex - 1, 0); drawMenu(); return; }
      if (e.key === "ArrowLeft") { e.preventDefault(); if (currentDir !== "") { currentDir = dirParent(currentDir); refreshMentionMenu(); } return; }
      if (e.key === "ArrowRight") {
        e.preventDefault();
        var sel = menuItems[menuIndex];
        if (sel && sel.kind === "dir") { currentDir = sel.rel; refreshMentionMenu(); }
        return;
      }
      if (e.key === "Enter") {
        e.preventDefault();
        var it = menuItems[menuIndex];
        if (!it) { hideMenu(); return; }
        if (it.kind === "up") { currentDir = dirParent(currentDir); refreshMentionMenu(); }
        else if (it.kind === "dir") { currentDir = it.rel; refreshMentionMenu(); }
        else if (it.kind === "file") insertMention(it.rel, false);
        else if (it.kind === "slash") runSlash(it.cmd);
        else hideMenu();
        return;
      }
      if (e.key === "Escape") { e.preventDefault(); hideMenu(); return; }
    }
    if (e.key === "ArrowUp" && history.length > 0) {
      e.preventDefault();
      if (historyIndex === -1) { historyDraft = inputEl.value; historyIndex = 0; }
      else historyIndex = Math.min(historyIndex + 1, history.length - 1);
      inputEl.value = history[history.length - 1 - historyIndex];
      autoGrow();
      inputEl.setSelectionRange(inputEl.value.length, inputEl.value.length);
      return;
    }
    if (e.key === "ArrowDown") {
      if (historyIndex === -1) return; // not navigating yet — keep default caret behavior
      e.preventDefault();
      historyIndex--;
      inputEl.value = historyIndex === -1 ? historyDraft : history[history.length - 1 - historyIndex];
      autoGrow();
      inputEl.setSelectionRange(inputEl.value.length, inputEl.value.length);
      return;
    }
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send();
    }
  });
  sendBtn.addEventListener("click", send);
  modelEl.addEventListener("change", function () {
    var v = modelEl.value;
    if (!v) return;
    var i = v.indexOf("|");
    post({ type: "selectModel", provider: v.slice(0, i), model: v.slice(i + 1) });
  });
  effortEl.addEventListener("change", function () {
    var v = effortEl.value;
    var mv = modelEl.value;
    if (!v || !mv) return;
    var i = mv.indexOf("|");
    post({ type: "selectModel", provider: mv.slice(0, i), model: mv.slice(i + 1), reasoningEffort: v });
  });
  presetEl.addEventListener("change", function () {
    var v = presetEl.value;
    if (v) post({ type: "selectPermission", permission: v });
  });
  // Pull the permission presets once the panel is live (header select).
  post({ type: "getPermissions" });

  /* ---------- image attachments (Ctrl+V paste) ---------- */
  var attachments = [];
  function renderAttachments() {
    attachEl.innerHTML = "";
    if (!attachments.length) { attachEl.hidden = true; return; }
    attachEl.hidden = false;
    attachments.forEach(function (a, i) {
      var chip = document.createElement("div");
      chip.className = "attach-chip";
      var img = document.createElement("img");
      img.src = "data:" + a.mediaType + ";base64," + a.data;
      var name = document.createElement("span");
      name.className = "aname";
      name.textContent = a.name || (a.mediaType.replace("image/", "") + " 图片");
      var x = document.createElement("span");
      x.className = "ax";
      x.textContent = "×";
      x.onclick = function (idx) { return function () { attachments.splice(idx, 1); renderAttachments(); }; }(i);
      chip.appendChild(img); chip.appendChild(name); chip.appendChild(x);
      attachEl.appendChild(chip);
    });
  }
  inputEl.addEventListener("paste", function (e) {
    var items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    var got = false;
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (it.kind === "file" && it.type && /^image\/(png|jpeg|webp|gif)$/.test(it.type)) {
        var file = it.getAsFile();
        if (!file) continue;
        got = true;
        var reader = new FileReader();
        reader.onload = (function (f, mt) { return function () {
          var result = String(reader.result || "");
          var comma = result.indexOf(",");
          if (comma < 0) return;
          attachments.push({ mediaType: mt, data: result.slice(comma + 1), name: f.name || "" });
          renderAttachments();
        }; })(file, it.type);
        reader.readAsDataURL(file);
      }
    }
    if (got) e.preventDefault();
  });

  function send() {
    var text = inputEl.value.trim();
    if (!text && attachments.length === 0) return;
    // While the agent is running, Enter queues the message (harness queue);
    // cap the pending queue at 4. Slash commands never queue — they execute
    // immediately via commands/execute, so they skip the cap (and must, so a
    // typed "/compact" can't be blocked by the queue).
    if (text && state.running && !(text.startsWith("/") && attachments.length === 0)) {
      var queued = state.queue.filter(function (it) { return it.placement === "queued"; }).length;
      if (queued >= 4) {
        statusEl.textContent = "队列已满（最多 4 条）";
        return;
      }
    }
    hideMenu();
    if (text) {
      state.items.push({ kind: "user", text: text, pending: true, turn: state.lastTurn });
      scheduleRender();
    }
    post({ type: "send", text: text, attachments: attachments.slice(), mode: "queue" });
    history.push(text || ("📷 " + attachments.length + " 张图片"));
    if (history.length > 200) history.shift();
    historyIndex = -1;
    historyDraft = "";
    attachments = [];
    renderAttachments();
    inputEl.value = "";
    autoGrow();
  }
  cancelBtn.addEventListener("click", function () { post({ type: "cancel" }); });
  if (todoToggleEl) todoToggleEl.addEventListener("click", function () {
    state.todoOpen = !state.todoOpen;
    renderTodos(); // rebuilds the list + chevron in the new state
  });
  selEl.addEventListener("change", function () {
    if (selEl.value) post({ type: "selectSession", sessionId: selEl.value });
  });
  $("new-session").addEventListener("click", function () { post({ type: "newSession" }); });
  var delBtn = $("delete-session");
  delBtn.addEventListener("click", function () {
    if (!selEl.value) return;
    if (delBtn.dataset.arm === "1") {
      delete delBtn.dataset.arm;
      delBtn.textContent = "🗑";
      post({ type: "deleteSession", sessionId: selEl.value });
    } else {
      delBtn.dataset.arm = "1";
      delBtn.textContent = "确认?";
      setTimeout(function () { delete delBtn.dataset.arm; delBtn.textContent = "🗑"; }, 3000);
    }
  });

  post({ type: "ready" });
})();
</script>
</body>
</html>
