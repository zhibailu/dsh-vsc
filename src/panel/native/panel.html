<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;">
<title>DSH</title>
<style>
  :root {
    --fg: var(--vscode-editor-foreground, #d4d4d4);
    --bg: var(--vscode-sideBar-background, #1e1e1e);
    --muted: var(--vscode-descriptionForeground, #9d9d9d);
    --border: var(--vscode-widget-border, #454545);
    --accent: var(--vscode-button-background, #0e639c);
    --accent-fg: var(--vscode-button-foreground, #ffffff);
    --input-bg: var(--vscode-input-background, #3c3c3c);
    --err: var(--vscode-errorForeground, #f14c4c);
    --ok: #4ec9b0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--fg);
         font-family: var(--vscode-font-family); font-size: var(--vscode-font-size, 13px); overflow: hidden; }

  header { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-bottom: 1px solid var(--border); flex: none; }
  .pill { font-size: 11px; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
  .pill.on { background: rgba(78, 201, 176, .15); color: var(--ok); }
  .pill.off { background: rgba(244, 76, 76, .15); color: var(--err); }
  .pill.busy { background: rgba(224, 185, 74, .18); color: #e0b94a; }
  #session-select { flex: 1; min-width: 0; background: var(--input-bg); color: var(--fg);
                    border: 1px solid var(--border); border-radius: 2px; padding: 2px 4px; font-size: 12px; }
  #new-session { flex: none; width: 24px; height: 24px; border: 1px solid var(--border); border-radius: 2px;
                 background: transparent; color: var(--fg); cursor: pointer; }
  #new-session:hover { background: var(--input-bg); }
  #model-select { flex: none; max-width: 120px; background: var(--input-bg); color: var(--fg);
                  border: 1px solid var(--border); border-radius: 2px; padding: 2px 4px; font-size: 12px; }

  #attach-row { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 4px; }
  .attach-chip { display: flex; align-items: center; gap: 4px; max-width: 180px; border: 1px solid var(--border);
                 border-radius: 3px; padding: 2px 4px; background: var(--input-bg); font-size: 11px; }
  .attach-chip img { width: 22px; height: 22px; object-fit: cover; border-radius: 2px; flex: none; }
  .attach-chip .aname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .attach-chip .ax { cursor: pointer; color: var(--err); font-weight: 700; padding: 0 2px; }

  #messages { flex: 1; overflow-y: auto; padding: 8px 10px; }
  .turn-sep { display: flex; align-items: center; gap: 8px; margin: 14px 0 8px; color: var(--muted); font-size: 11px; }
  .turn-sep::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  .msg { margin: 6px 0; line-height: 1.55; word-wrap: break-word; }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .body { max-width: 92%; background: var(--input-bg); border: 1px solid var(--border);
                    border-radius: 6px; padding: 6px 10px; white-space: pre-wrap; }
  .msg.assistant .body { white-space: pre-wrap; }
  .reasoning { border-left: 2px solid var(--border); padding: 2px 10px; color: var(--muted); margin: 4px 0; }
  .reasoning summary { cursor: pointer; user-select: none; font-size: 12px; }
  .reasoning pre { margin: 4px 0; white-space: pre-wrap; font-family: inherit; font-size: 12px; }
  .msg .stream-cursor::after { content: "▍"; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .tool { border: 1px solid var(--border); border-radius: 4px; margin: 6px 0; overflow: hidden; }
  .tool summary { cursor: pointer; user-select: none; padding: 4px 8px; display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .tool .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .tool .dot.run { background: #e0b94a; animation: blink 1s infinite; }
  .tool .dot.ok { background: var(--ok); }
  .tool .dot.err { background: var(--err); }
  .tool .tname { font-weight: 600; }
  .tool .targs { padding: 0 8px 6px; }
  .tool pre { margin: 4px 0; padding: 6px 8px; background: var(--input-bg); border-radius: 3px;
              white-space: pre-wrap; word-break: break-all; font-family: var(--vscode-editor-font-family, monospace); font-size: 12px; }

  .sys-err { margin: 6px 0; padding: 6px 10px; border-left: 3px solid var(--err); color: var(--err); white-space: pre-wrap; font-size: 12px; }
  .empty { color: var(--muted); text-align: center; margin-top: 40px; font-size: 12px; line-height: 2; }

  footer { flex: none; position: relative; border-top: 1px solid var(--border); padding: 6px 8px; }
  #mention-menu { position: absolute; bottom: 100%; left: 8px; right: 8px; max-height: 40vh; overflow-y: auto;
    background: var(--vscode-quickInput-background, var(--input-bg)); color: var(--fg);
    border: 1px solid var(--border); border-radius: 4px; z-index: 20; font-size: 12px;
    box-shadow: 0 4px 12px rgba(0,0,0,.35); }
  .m-item { padding: 4px 8px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m-item.sel { background: var(--vscode-list-activeSelectionBackground, #094771);
                color: var(--vscode-list-activeSelectionForeground, #ffffff); }
  .m-item.hint { color: var(--muted); cursor: default; }
  .m-kind { opacity: .5; margin-right: 2px; }
  .m-path { opacity: .6; margin-left: 8px; font-size: 11px; }
  .m-crumbs { padding: 4px 8px; border-bottom: 1px solid var(--border); color: var(--muted);
              font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m-crumbs span { cursor: pointer; }
  .m-crumbs span:hover { color: var(--fg); text-decoration: underline; }
  .m-crumbs span.cur { color: var(--fg); cursor: default; }
  #input-status { font-size: 11px; color: var(--muted); min-height: 16px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #input-row { display: flex; gap: 6px; align-items: flex-end; }
  #input { flex: 1; resize: none; background: var(--input-bg); color: var(--fg); border: 1px solid var(--border);
           border-radius: 3px; padding: 6px 8px; font-family: inherit; font-size: 13px; max-height: 180px; }
  #input:focus { outline: 1px solid var(--accent); }
  .btn { width: 28px; height: 28px; border: 1px solid var(--border); border-radius: 3px; background: transparent; color: var(--fg); cursor: pointer; flex: none; }
  .btn:hover { background: var(--input-bg); }
  .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
  .btn.primary:disabled { opacity: .5; cursor: default; }
  #cancel { color: var(--err); }

  #queue-row { display: flex; flex-direction: column; gap: 4px; padding-bottom: 4px; }
  .q-item { display: flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: 3px;
            padding: 3px 6px; background: var(--input-bg); font-size: 12px; }
  .q-item .qtag { font-size: 10px; color: var(--muted); flex: none; }
  .q-item .qtext { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg); }
  .q-item .qbtn { flex: none; cursor: pointer; color: var(--muted); padding: 0 3px; border: none; background: none; font-size: 11px; }
  .q-item .qbtn:hover { color: var(--fg); }
  .q-item .qbtn.danger:hover { color: var(--err); }

  .msg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 2px; }
  .msg-actions button { cursor: pointer; background: none; border: none; color: var(--muted); font-size: 11px; padding: 0 2px; }
  .msg-actions button:hover { color: var(--fg); }
  .edit-box { width: 100%; box-sizing: border-box; background: var(--input-bg); color: var(--fg);
              border: 1px solid var(--accent); border-radius: 3px; padding: 6px 8px;
              font-family: inherit; font-size: 13px; resize: vertical; min-height: 60px; }
</style>
</head>
<body>
  <header>
    <span id="pill" class="pill off">○</span>
    <select id="session-select" title="切换会话"></select>
    <select id="model-select" title="切换模型" hidden></select>
    <button id="new-session" title="新会话">＋</button>
  </header>
  <main id="messages"></main>
  <footer>
    <div id="mention-menu" hidden></div>
    <div id="attach-row" hidden></div>
    <div id="queue-row" hidden></div>
    <div id="input-status"></div>
    <div id="input-row">
      <textarea id="input" rows="1" placeholder="发消息…（Enter 发送，运行中自动排队；Shift+Enter 换行；Ctrl+V 粘图片）"></textarea>
      <button id="send" class="btn primary" title="发送">➤</button>
      <button id="cancel" class="btn" title="停止当前回合" hidden>✕</button>
    </div>
  </footer>
<script>
(function () {
  "use strict";
  var vscode = acquireVsCodeApi();
  var $ = function (id) { return document.getElementById(id); };
  var messagesEl = $("messages"), pillEl = $("pill"), selEl = $("session-select"),
      modelEl = $("model-select"), attachEl = $("attach-row"), queueEl = $("queue-row"),
      inputEl = $("input"), sendBtn = $("send"), cancelBtn = $("cancel"), statusEl = $("input-status");

  var state = {
    connected: false, version: null,
    sessions: [], activeSessionId: null,
    items: [], seqs: new Set(), oldestSeq: Infinity,
    running: false, lastTurn: -1,
    curAssistant: null, openBlocks: [],
    titles: {},
    models: null,            // { current: {provider, model}, groups: [...] }
    usage: null,             // active session tokenUsage projection
    queue: [],               // session/queue snapshot for the active session
    turnStart: 0, firstTokenAt: 0, turnOutput: 0
  };

  function post(msg) { try { vscode.postMessage(msg); } catch (e) {} }
  function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function relTime(ts) {
    if (!ts) return "";
    var diff = Date.now() - ts;
    if (diff < 60e3) return "刚刚";
    if (diff < 3600e3) return Math.floor(diff / 60e3) + "分钟前";
    if (diff < 86400e3) return Math.floor(diff / 3600e3) + "小时前";
    if (diff < 172800e3) return "昨天";
    if (diff < 604800e3) return Math.floor(diff / 86400e3) + "天前";
    var d = new Date(ts);
    return (d.getMonth() + 1) + "-" + d.getDate();
  }
  function shortId(id) { return String(id || "").replace(/^session-/, "").slice(0, 8); }

  /* ---------- markdown-lite ---------- */
  function renderInline(text) {
    return esc(text)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  }
  function renderText(text) {
    var parts = String(text).split(/```/);
    var out = "";
    for (var i = 0; i < parts.length; i++) {
      if (i % 2 === 0) {
        out += renderInline(parts[i]);
      } else {
        var lines = parts[i].split("\n");
        if (lines[0] && /^[a-zA-Z0-9_-]+$/.test(lines[0].trim())) lines.shift();
        out += "<pre><code>" + esc(lines.join("\n")) + "</code></pre>";
      }
    }
    return out;
  }

  /* ---------- helpers on event payloads ---------- */
  function blocksOf(message) { return (message && message.content) || []; }
  function textBlocksOf(message) {
    return blocksOf(message).filter(function (b) { return b && b.type === "text"; })
      .map(function (b) { return b.text; }).join("");
  }
  function contentBlocks(message) {
    return blocksOf(message).filter(function (b) {
      return b && (b.type === "text" || b.type === "reasoning");
    }).map(function (b) {
      return { type: b.type, text: String(b.text || "") };
    });
  }
  function prettyArgs(s) {
    try { return JSON.stringify(JSON.parse(s), null, 2); } catch (e) { return String(s || ""); }
  }
  function summarizeResult(content) {
    var parts = [];
    (content || []).forEach(function (b) {
      if (b && typeof b.text === "string") parts.push(b.text);
      else if (b && b.type === "tool-result" && Array.isArray(b.content)) parts.push(summarizeResult(b.content));
    });
    var s = parts.join("\n").trim();
    return s.length > 1500 ? s.slice(0, 1500) + "\n…（截断）" : s;
  }

  /* ---------- fold: events -> render items ---------- */
  function finalizeStream() {
    if (state.curAssistant) {
      state.curAssistant.streaming = false;
      state.curAssistant = null;
    }
    state.openBlocks = [];
  }
  function ensureAssistant() {
    if (!state.curAssistant) {
      state.curAssistant = { kind: "assistant", blocks: [], done: false, streaming: true };
      state.items.push(state.curAssistant);
    }
  }
  function syncAssistantFromBlocks() {
    if (!state.curAssistant) return;
    state.curAssistant.blocks = state.openBlocks
      .filter(function (b) { return b && b.text; })
      .map(function (b) { return { type: b.type, text: b.text }; });
  }
  function findTool(callId) {
    for (var i = state.items.length - 1; i >= 0; i--) {
      if (state.items[i].kind === "tool" && state.items[i].callId === callId) return state.items[i];
    }
    return null;
  }

  function applyEvent(ev) {
    if (ev && typeof ev.seq === "number") {
      if (state.seqs.has(ev.seq)) return;
      state.seqs.add(ev.seq);
      if (ev.seq < state.oldestSeq) state.oldestSeq = ev.seq;
    }
    var d = (ev && ev.data) || {};
    switch (ev && ev.type) {
      case "turn/start":
        finalizeStream();
        state.lastTurn = typeof d.turn === "number" ? d.turn : state.lastTurn + 1;
        state.turnStart = performance.now(); state.firstTokenAt = 0; state.turnOutput = 0;
        state.items.push({ kind: "turn", turn: state.lastTurn, done: false });
        break;
      case "user/message": {
        // user/message carries content at data.content (assistant/message wraps
        // it under data.message) — accept either shape.
        var msg = d.message || d;
        var u = textBlocksOf(msg);
        if (u) {
          var last = state.items[state.items.length - 1];
          if (last && last.kind === "user" && last.pending) { last.text = u; last.pending = false; last.turn = d.turn; }
          else state.items.push({ kind: "user", text: u, turn: d.turn });
        }
        break;
      }
      case "assistant/chunk": {
        var chunk = d.chunk || {};
        ensureAssistant();
        if (chunk.type === "block-start") {
          state.openBlocks[chunk.index] = { type: chunk.blockType || "text", text: "" };
        } else if (chunk.type === "usage") {
          if (chunk.usage && typeof chunk.usage.outputTokens === "number") state.turnOutput = chunk.usage.outputTokens;
        } else if (chunk.type === "text-delta" || chunk.type === "reasoning-delta") {
          if (!state.firstTokenAt) state.firstTokenAt = performance.now();
          var b = state.openBlocks[chunk.index] || (state.openBlocks[chunk.index] = { type: chunk.type === "reasoning-delta" ? "reasoning" : "text", text: "" });
          if (chunk.text) b.text += chunk.text;
          syncAssistantFromBlocks();
        }
        break;
      }
      case "assistant/message": {
        ensureAssistant();
        state.curAssistant.blocks = contentBlocks(d.message);
        state.curAssistant.done = true;
        state.curAssistant.streaming = false;
        state.curAssistant = null;
        state.openBlocks = [];
        break;
      }
      case "tool/call":
        state.items.push({ kind: "tool", callId: d.callId, name: d.name || "tool",
                           argsText: prettyArgs(d.arguments), status: "running", resultText: "" });
        break;
      case "tool/result": {
        var msg = d.message || {};
        var block = null;
        (msg.content || []).forEach(function (b) { if (b && b.type === "tool-result") block = b; });
        var callId = (block && block.toolCallId) || d.callId;
        var tool = findTool(callId);
        if (tool) {
          tool.status = block && block.isError ? "error" : "ok";
          tool.resultText = summarizeResult(block && block.content);
        }
        break;
      }
      case "turn/end": {
        finalizeStream();
        for (var i = state.items.length - 1; i >= 0; i--) {
          if (state.items[i].kind === "turn") { state.items[i].done = true; break; }
        }
        break;
      }
      case "session/title":
        if (typeof d.title === "string") { state.titles[state.activeSessionId] = d.title; }
        break;
    }
    scheduleRender();
  }

  /* ---------- rendering (rAF-throttled full rebuild) ---------- */
  var dirty = false, forceBottom = true, suspended = false;
  function scheduleRender() {
    // While the user is reading history mid-turn the DOM is frozen; events
    // keep folding into state.items in memory, and the next render happens
    // when they scroll back to the bottom (or the view resets).
    if (suspended) return;
    if (dirty) return;
    dirty = true;
    requestAnimationFrame(render);
  }
  function scrollPos() {
    return messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 20;
  }
  messagesEl.addEventListener("scroll", function () {
    if (suspended && scrollPos()) {
      suspended = false;
      scheduleRender();
    }
  });
  function render() {
    dirty = false;
    var stick = forceBottom || scrollPos();
    forceBottom = false;
    if (!stick && state.running) { suspended = true; return; }
    var prevTop = messagesEl.scrollTop;
    var prevHeight = messagesEl.scrollHeight;
    var frag = document.createDocumentFragment();

    if (!state.connected) {
      frag.appendChild(emptyDiv("harness 未连接。<br>状态栏点击「DSH」或命令面板运行「DSH: Start Web Harness」。"));
    } else if (state.items.length === 0) {
      frag.appendChild(emptyDiv("没有消息。<br>输入框发消息即可开始（会自动创建会话）。"));
    }

    for (var i = 0; i < state.items.length; i++) {
      frag.appendChild(renderItem(state.items[i]));
    }
    messagesEl.innerHTML = "";
    messagesEl.appendChild(frag);
    if (stick) {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    } else {
      // User scrolled away from the bottom (e.g. reading history mid-turn):
      // keep the same content anchored instead of yanking down.
      messagesEl.scrollTop = prevTop + (messagesEl.scrollHeight - prevHeight);
    }
    updateStatusLine();
  }
  function emptyDiv(html) { var d = document.createElement("div"); d.className = "empty"; d.innerHTML = html; return d; }

  function renderItem(item) {
    var el = document.createElement("div");
    switch (item.kind) {
      case "turn": {
        el.className = "turn-sep";
        el.innerHTML = "<span>— 第 " + item.turn + " 轮" + (item.done ? "" : " · 进行中") + " —</span>";
        break;
      }
      case "user": {
        el.className = "msg user";
        if (item.editing) {
          var ta = document.createElement("textarea");
          ta.className = "edit-box";
          ta.value = item.text;
          var act = document.createElement("div");
          act.className = "msg-actions";
          var save = document.createElement("button");
          save.textContent = "保存（打断生效）";
          var cancel = document.createElement("button");
          cancel.textContent = "取消";
          act.appendChild(save);
          act.appendChild(cancel);
          var body = document.createElement("div");
          body.className = "body";
          body.style.maxWidth = "92%";
          body.appendChild(ta);
          body.appendChild(act);
          el.appendChild(body);
          save.onclick = function () {
            var v = ta.value.trim();
            if (!v) return;
            item.editing = false;
            item.text = v;
            post({ type: "send", text: v, mode: "steer" });
            scheduleRender();
          };
          cancel.onclick = function () { item.editing = false; scheduleRender(); };
          ta.addEventListener("keydown", function (e) {
            if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); save.onclick(); }
          });
          setTimeout(function () { ta.focus(); ta.select(); }, 0);
        } else {
          var ub = document.createElement("div");
          ub.className = "body";
          ub.innerHTML = renderInline(item.text);
          el.appendChild(ub);
          var ua = document.createElement("div");
          ua.className = "msg-actions";
          if (item.turn === state.lastTurn && state.running) {
            var ed = document.createElement("button");
            ed.textContent = "✎ 编辑";
            ed.onclick = function () { item.editing = true; scheduleRender(); };
            ua.appendChild(ed);
          }
          var cp = document.createElement("button");
          cp.textContent = "⧉ 复制";
          cp.onclick = function () { post({ type: "copyText", text: item.text }); };
          ua.appendChild(cp);
          el.appendChild(ua);
        }
        break;
      }
      case "assistant": {
        el.className = "msg assistant";
        var html = "";
        item.blocks.forEach(function (b) {
          if (b.type === "reasoning") {
            html += "<details class='reasoning'><summary>思考</summary><pre>" + esc(b.text) + "</pre></details>";
          } else {
            html += "<div class='body'>" + renderText(b.text) + (item.streaming ? "<span class='stream-cursor'></span>" : "") + "</div>";
          }
        });
        if (item.blocks.length === 0 && item.streaming) html = "<div class='body'><span class='stream-cursor'></span></div>";
        el.innerHTML = html;
        if (!item.streaming) {
          var aa = document.createElement("div");
          aa.className = "msg-actions";
          var acp = document.createElement("button");
          acp.textContent = "⧉ 复制";
          acp.onclick = function () {
            var all = item.blocks.filter(function (b) { return b.type === "text"; }).map(function (b) { return b.text; }).join("\n");
            post({ type: "copyText", text: all });
          };
          aa.appendChild(acp);
          el.appendChild(aa);
        }
        break;
      }
      case "tool": {
        el.className = "tool";
        var dot = item.status === "running" ? "run" : item.status === "error" ? "err" : "ok";
        var body = "<summary><span class='dot " + dot + "'></span><span class='tname'>" + esc(item.name) + "</span></summary>";
        if (item.argsText) body += "<div class='targs'><pre>" + esc(item.argsText) + "</pre></div>";
        if (item.resultText) body += "<div class='targs'><pre>" + esc(item.resultText) + "</pre></div>";
        el.innerHTML = body;
        break;
      }
      default:
        el.className = "sys-err";
        el.textContent = JSON.stringify(item);
    }
    return el;
  }

  /* ---------- pending-send queue rows (session/queue snapshot) ---------- */
  function renderQueue() {
    queueEl.innerHTML = "";
    if (!state.queue.length) { queueEl.hidden = true; return; }
    queueEl.hidden = false;
    state.queue.forEach(function (it) {
      var row = document.createElement("div");
      row.className = "q-item";
      var tag = document.createElement("span");
      tag.className = "qtag";
      tag.textContent = it.placement === "steering" ? "插入中" : it.placement === "context" ? "上下文" : "排队";
      var txt = document.createElement("span");
      txt.className = "qtext";
      txt.textContent = it.text || "(图片)";
      txt.title = it.text;
      row.appendChild(tag);
      row.appendChild(txt);
      var qbtn = function (label, title, fn, danger) {
        var b = document.createElement("button");
        b.className = "qbtn" + (danger ? " danger" : "");
        b.textContent = label;
        b.title = title;
        b.onclick = fn;
        return b;
      };
      row.appendChild(qbtn("copy", "复制", function () { post({ type: "copyText", text: it.text }); }));
      if (it.placement === "queued") {
        row.appendChild(qbtn("steer", "在下一个 LLM 回复后插入（打断）", function () { post({ type: "queueSteer", itemId: it.id }); }));
        row.appendChild(qbtn("del", "撤回（从队列移除）", function () { post({ type: "queueRemove", itemId: it.id }); }, true));
      }
      queueEl.appendChild(row);
    });
  }

  /* ---------- protocol from host ---------- */
  window.addEventListener("message", function (event) {
    var msg = event.data;
    if (!msg || typeof msg !== "object") return;
    switch (msg.type) {
      case "state": {
        state.connected = msg.connected;
        state.version = msg.version;
        state.sessions = msg.sessions || [];
        state.activeSessionId = msg.activeSessionId;
        if (state.activeSessionId && state.titles[state.activeSessionId] === undefined) {
          state.titles[state.activeSessionId] = undefined;
        }
        var act = (msg.sessions || []).find(function (x) { return x.sessionId === msg.activeSessionId; });
        state.usage = act && act.usage ? act.usage : null;
        // If the active session changed (or first state), reset the view to that session's cache
        if (msg.activeSessionId !== state.lastSessionId) {
          state.lastSessionId = msg.activeSessionId;
          state.items = []; state.seqs = new Set(); state.oldestSeq = Infinity;
          state.curAssistant = null; state.openBlocks = [];
          state.queue = []; renderQueue();
          suspended = false;
          forceBottom = true;
        }
        updateHeader();
        scheduleRender();
        break;
      }
      case "models": {
        state.models = msg;
        modelEl.innerHTML = "";
        if (msg.groups && msg.groups.length) {
          msg.groups.forEach(function (g) {
            var og = document.createElement("optgroup");
            og.label = g.name || g.id;
            g.models.forEach(function (m) {
              var o = document.createElement("option");
              o.value = g.id + "|" + m.id;
              o.textContent = m.name;
              if (msg.current && msg.current.provider === g.id && msg.current.model === m.id) o.selected = true;
              og.appendChild(o);
            });
            modelEl.appendChild(og);
          });
          modelEl.hidden = false;
        } else {
          modelEl.hidden = true;
        }
        break;
      }
      case "history": {
        if (msg.sessionId !== state.activeSessionId) return;
        state.items = []; state.seqs = new Set(); state.oldestSeq = Infinity;
        state.curAssistant = null; state.openBlocks = [];
        // NOTE: do NOT clear state.queue here — send() triggers a history
        // reload right after a queue prompt, and wiping the queue here would
        // race the session/queue frame and hide the pending rows.
        suspended = false;
        forceBottom = true;
        (msg.events || []).forEach(applyEvent);
        scheduleRender();
        break;
      }
      case "event": {
        if (msg.sessionId !== state.activeSessionId) return;
        applyEvent(msg.event);
        break;
      }
      case "running": {
        if (msg.sessionId === state.activeSessionId) {
          state.running = msg.running;
          updateHeader();
        }
        break;
      }
      case "queue": {
        if (msg.sessionId !== state.activeSessionId) return;
        state.queue = msg.items || [];
        renderQueue();
        break;
      }
      case "error":
        state.items.push({ kind: "error", text: msg.message });
        scheduleRender();
        break;
      case "index":
        fileIndex = { files: msg.files || [], dirs: msg.dirs || [] };
        if (menuActive) refreshMentionMenu();
        break;
      case "pickedFile":
        insertMention(msg.path);
        break;
    }
  });

  /* ---------- @ mention: drill-down directory menu above the input ---------- */
  var mentionTimer = null;
  var menuEl = $("mention-menu");
  var menuItems = [], menuIndex = 0, menuActive = false, menuMode = "mention";
  var fileIndex = { files: [], dirs: [] };
  var currentDir = "";

  function mentionMatch(value) {
    var m = /(?:^|\s)@([^\s@]*)$/.exec(value);
    return m ? { query: m[1], start: m.index + m[0].indexOf("@") } : null;
  }
  function mentionFor(relPath, isDir) {
    var p = isDir ? relPath + "/" : relPath; // DSH grammar: directories carry a trailing slash
    return /[\s"]/.test(p) ? '@"' + p + '"' : "@" + p;
  }
  function insertMention(relPath, isDir) {
    var m = mentionMatch(inputEl.value);
    var mention = mentionFor(relPath, isDir);
    var before = m ? inputEl.value.slice(0, m.start) : inputEl.value;
    var after = m ? inputEl.value.slice(m.start + m.query.length + 1) : "";
    inputEl.value = before + mention + " " + after;
    inputEl.focus();
    autoGrow();
    hideMenu();
  }
  function dirParent(d) { var i = d.lastIndexOf("/"); return i < 0 ? "" : d.slice(0, i); }
  function childrenOf(dir) {
    var prefix = dir ? dir + "/" : "";
    var dirs = fileIndex.dirs.filter(function (d) {
      return d.slice(0, prefix.length) === prefix && d.slice(prefix.length).indexOf("/") < 0;
    }).sort();
    var files = fileIndex.files.filter(function (f) {
      return f.slice(0, prefix.length) === prefix && f.slice(prefix.length).indexOf("/") < 0;
    }).sort();
    return { dirs: dirs, files: files };
  }
  function menuRows(q) {
    var v = q.trim().toLowerCase();
    var c = childrenOf(currentDir);
    if (v) {
      var hit = function (p) { return p.toLowerCase().indexOf(v) >= 0 || p.split("/").pop().toLowerCase().indexOf(v) >= 0; };
      c = { dirs: c.dirs.filter(hit), files: c.files.filter(hit) };
    }
    var rows = [];
    if (currentDir !== "") rows.push({ kind: "up", rel: currentDir, name: "↑ 上级" });
    c.dirs.forEach(function (d) { rows.push({ kind: "dir", rel: d, name: d.split("/").pop() + "/" }); });
    c.files.forEach(function (f) { rows.push({ kind: "file", rel: f, name: f.split("/").pop() }); });
    return rows.slice(0, 60);
  }
  function drawBreadcrumbs() {
    var div = document.createElement("div");
    div.className = "m-crumbs";
    if (currentDir === "") {
      div.innerHTML = "<span class='cur'>工作区</span>";
    } else {
      var segs = currentDir.split("/");
      var root = document.createElement("span");
      root.textContent = "工作区";
      root.onclick = function () { currentDir = ""; refreshMentionMenu(); };
      div.appendChild(root);
      var acc = "";
      segs.forEach(function (seg, i) {
        div.appendChild(document.createTextNode(" / "));
        acc = acc ? acc + "/" + seg : seg;
        var s = document.createElement("span");
        s.textContent = seg;
        if (i === segs.length - 1) s.className = "cur";
        else s.onclick = (function (p) { return function () { currentDir = p; refreshMentionMenu(); }; })(acc);
        div.appendChild(s);
      });
    }
    return div;
  }
  function drawMenu() {
    menuEl.innerHTML = "";
    if (menuMode === "mention") menuEl.appendChild(drawBreadcrumbs());
    menuItems.forEach(function (it, i) {
      var div = document.createElement("div");
      div.className = "m-item" + (it.kind === "hint" ? " hint" : "") + (i === menuIndex ? " sel" : "");
      if (it.kind === "hint") {
        div.textContent = it.name;
      } else if (it.kind === "up") {
        div.textContent = it.name;
        div.onclick = function () { currentDir = dirParent(currentDir); refreshMentionMenu(); };
        div.onmouseenter = function () { if (menuIndex !== i) { menuIndex = i; drawMenu(); } };
      } else if (it.kind === "slash") {
        var k2 = document.createElement("span");
        k2.className = "m-kind";
        k2.textContent = "命令";
        var n2 = document.createTextNode("·" + it.name + " ");
        var d = document.createElement("span");
        d.className = "m-path";
        d.textContent = it.desc;
        div.appendChild(k2);
        div.appendChild(n2);
        div.appendChild(d);
        div.onclick = function () { insertSlash(it.name.slice(1)); };
        div.onmouseenter = function () { if (menuIndex !== i) { menuIndex = i; drawMenu(); } };
      } else {
        var kind = document.createElement("span");
        kind.className = "m-kind";
        kind.textContent = it.kind === "dir" ? "文件夹" : "文件";
        var name = document.createTextNode("·" + it.name + " ");
        var p = document.createElement("span");
        p.className = "m-path";
        p.textContent = it.rel;
        div.appendChild(kind);
        div.appendChild(name);
        div.appendChild(p);
        div.onclick = function () {
          if (it.kind === "dir") { currentDir = it.rel; refreshMentionMenu(); }
          else insertMention(it.rel, false);
        };
        div.onmouseenter = function () { if (menuIndex !== i) { menuIndex = i; drawMenu(); } };
      }
      menuEl.appendChild(div);
    });
    menuEl.hidden = false;
  }
  function showMenu(items) { menuItems = items; menuIndex = 0; menuActive = true; drawMenu(); }
  function hideMenu() { menuActive = false; menuEl.hidden = true; menuItems = []; }
  function refreshMentionMenu() {
    var m = mentionMatch(inputEl.value);
    if (m) {
      menuMode = "mention";
      if (fileIndex.files.length === 0 && fileIndex.dirs.length === 0) {
        showMenu([{ kind: "hint", name: "文件索引加载中…", rel: null }]);
        post({ type: "refreshFiles" });
        return;
      }
      var items = menuRows(m.query);
      showMenu(items.length ? items : [{ kind: "hint", name: "无匹配", rel: null }]);
      return;
    }
    var s = slashMatch(inputEl.value);
    if (s) {
      menuMode = "slash";
      var rows = slashRows(s.query);
      showMenu(rows.length ? rows : [{ kind: "hint", name: "无匹配", rel: null }]);
      return;
    }
    hideMenu();
  }
  function maybeTriggerMention() {
    if (mentionTimer) clearTimeout(mentionTimer);
    mentionTimer = setTimeout(refreshMentionMenu, 120);
  }

  /* ---------- / command picker (mirrors the DSH slash trigger) ---------- */
  var SLASH_COMMANDS = [
    { name: "compact", desc: "压缩历史" },
    { name: "goal", desc: "查看 / 设定长任务目标" },
    { name: "plan", desc: "进入 / 退出计划模式" },
    { name: "permission", desc: "切换权限预设（沙箱 + 审批）" },
    { name: "feedback", desc: "反馈本次会话" }
  ];
  function slashMatch(value) {
    // '/' at line start or after whitespace; a second '/' or an inline URL
    // slash does NOT trigger (mirrors dsh-client-ui-input-trigger).
    var m = /(?:^|\s)\/([^\s\/]*)$/.exec(value);
    return m ? { query: m[1], start: m.index + m[0].indexOf("/") } : null;
  }
  function insertSlash(name) {
    var m = slashMatch(inputEl.value);
    var before = m ? inputEl.value.slice(0, m.start) : inputEl.value;
    var after = m ? inputEl.value.slice(m.start + m.query.length + 1) : "";
    inputEl.value = before + "/" + name + " " + after;
    inputEl.focus();
    autoGrow();
    hideMenu();
  }
  function slashRows(q) {
    var v = q.trim().toLowerCase();
    var rows = [];
    SLASH_COMMANDS.forEach(function (c) {
      if (v && c.name.indexOf(v) < 0) return;
      rows.push({ kind: "slash", name: "/" + c.name, desc: c.desc });
    });
    return rows.slice(0, 30);
  }

  function updateHeader() {
    var s = state.sessions.find(function (x) { return x.sessionId === state.activeSessionId; });
    if (state.connected) {
      pillEl.className = "pill " + (state.running ? "busy" : "on");
      pillEl.textContent = state.running ? "● 运行中" : "● 已连接";
      pillEl.title = "harness v" + (state.version || "?");
    } else {
      pillEl.className = "pill off";
      pillEl.textContent = "○ 离线";
    }
    selEl.innerHTML = "";
    state.sessions.forEach(function (sess) {
      var opt = document.createElement("option");
      opt.value = sess.sessionId;
      var title = state.titles[sess.sessionId] || sess.title || "";
      var label = title ? title : ("会话 " + shortId(sess.sessionId));
      var time = relTime(sess.updatedAt);
      opt.textContent = time ? (label + " · " + time) : label;
      if (sess.running) opt.textContent += " ●";
      if (sess.sessionId === state.activeSessionId) opt.selected = true;
      selEl.appendChild(opt);
    });
    cancelBtn.hidden = !state.running;
    sendBtn.disabled = !state.connected;
    updateStatusLine();
  }

  /* ---------- metrics line under the input (mirrors the DSH web StatsLine) ---------- */
  // Compact duration: 45.2s under a minute, 2m42s from there on.
  function fmtDur(ms) {
    var s = (ms || 0) / 1e3;
    if (s < 60) return (Math.round(s * 10) / 10) + "s";
    var whole = Math.round(s);
    return Math.floor(whole / 60) + "m" + (whole % 60) + "s";
  }
  // Compact token count: 517 / 12.2K / 517K / 1.2M (one decimal under three digits).
  function fmtTok(n) {
    var scaled = function (v) { return v >= 100 ? String(Math.round(v)) : String(Math.round(v * 10) / 10); };
    if (n < 1e3) return String(n);
    if (n < 1e6) return scaled(n / 1e3) + "K";
    return scaled(n / 1e6) + "M";
  }
  // Tokens/sec: whole tokens from ten up, one decimal below.
  function fmtTps(tps) {
    var c = Math.max(0, tps);
    return c >= 10 ? String(Math.round(c)) : String(Math.round(c * 10) / 10);
  }
  function updateStatusLine() {
    if (!state.connected) { statusEl.textContent = ""; return; }
    var groups = [];
    var act = state.sessions.find(function (x) { return x.sessionId === state.activeSessionId; });
    var st = act && act.stats;
    if (st && st.steps > 0) {
      groups.push((st.turns || 0) + " 轮 · " + st.steps + " 步");
      var durations = [];
      if (st.llmMs > 0) durations.push("LLM " + fmtDur(st.llmMs));
      if (st.toolMs > 0) durations.push("工具调用 " + fmtDur(st.toolMs));
      if (durations.length > 0) groups.push(durations.join(" · "));
      var speeds = [];
      if (st.ttftSteps > 0) speeds.push("首 token 平均 " + fmtDur(st.ttftMs / st.ttftSteps));
      if (st.decodeMs > 0) speeds.push(fmtTps(st.decodeTokens / (st.decodeMs / 1e3)) + " tok/s");
      if (speeds.length > 0) groups.push(speeds.join(" · "));
    }
    var u = state.usage;
    if (u) {
      var billed = (u.uncachedInputTokens || 0) + (u.cacheReadTokens || 0) + (u.cacheWriteTokens || 0);
      if (billed > 0 && typeof u.cacheReadTokens === "number") {
        groups.push("缓存命中 " + Math.round((u.cacheReadTokens / billed) * 100) + "%");
      }
      groups.push("输入 " + fmtTok(billed) + " tok · 输出 " + fmtTok(u.outputTokens || 0) + " tok");
    }
    var line = groups.join(" | ");
    if (state.running) {
      var live = [];
      if (state.firstTokenAt) {
        live.push("首 token " + ((state.firstTokenAt - state.turnStart) / 1000).toFixed(1) + "s");
        var elapsed = (performance.now() - state.firstTokenAt) / 1000;
        if (elapsed > 0.3 && state.turnOutput > 0) live.push(fmtTps(state.turnOutput / elapsed) + " tok/s");
      }
      line = (live.length ? live.join(" · ") + " | " : "") + line;
    }
    statusEl.textContent = line;
  }

  /* ---------- input ---------- */
  var history = [], historyIndex = -1, historyDraft = ""; // CLI-style ↑/↓ history
  function autoGrow() {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + "px";
  }
  inputEl.addEventListener("input", function () { autoGrow(); maybeTriggerMention(); });
  inputEl.addEventListener("keydown", function (e) {
    if (menuActive) {
      if (e.key === "ArrowDown") { e.preventDefault(); menuIndex = Math.min(menuIndex + 1, menuItems.length - 1); drawMenu(); return; }
      if (e.key === "ArrowUp") { e.preventDefault(); menuIndex = Math.max(menuIndex - 1, 0); drawMenu(); return; }
      if (e.key === "ArrowLeft") { e.preventDefault(); if (currentDir !== "") { currentDir = dirParent(currentDir); refreshMentionMenu(); } return; }
      if (e.key === "ArrowRight") {
        e.preventDefault();
        var sel = menuItems[menuIndex];
        if (sel && sel.kind === "dir") { currentDir = sel.rel; refreshMentionMenu(); }
        return;
      }
      if (e.key === "Enter") {
        e.preventDefault();
        var it = menuItems[menuIndex];
        if (!it) { hideMenu(); return; }
        if (it.kind === "up") { currentDir = dirParent(currentDir); refreshMentionMenu(); }
        else if (it.kind === "dir") { currentDir = it.rel; refreshMentionMenu(); }
        else if (it.kind === "file") insertMention(it.rel, false);
        else if (it.kind === "slash") insertSlash(it.name.slice(1));
        else hideMenu();
        return;
      }
      if (e.key === "Escape") { e.preventDefault(); hideMenu(); return; }
    }
    if (e.key === "ArrowUp" && history.length > 0) {
      e.preventDefault();
      if (historyIndex === -1) { historyDraft = inputEl.value; historyIndex = 0; }
      else historyIndex = Math.min(historyIndex + 1, history.length - 1);
      inputEl.value = history[history.length - 1 - historyIndex];
      autoGrow();
      inputEl.setSelectionRange(inputEl.value.length, inputEl.value.length);
      return;
    }
    if (e.key === "ArrowDown") {
      if (historyIndex === -1) return; // not navigating yet — keep default caret behavior
      e.preventDefault();
      historyIndex--;
      inputEl.value = historyIndex === -1 ? historyDraft : history[history.length - 1 - historyIndex];
      autoGrow();
      inputEl.setSelectionRange(inputEl.value.length, inputEl.value.length);
      return;
    }
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send();
    }
  });
  sendBtn.addEventListener("click", send);
  modelEl.addEventListener("change", function () {
    var v = modelEl.value;
    if (!v) return;
    var i = v.indexOf("|");
    post({ type: "selectModel", provider: v.slice(0, i), model: v.slice(i + 1) });
  });

  /* ---------- image attachments (Ctrl+V paste) ---------- */
  var attachments = [];
  function renderAttachments() {
    attachEl.innerHTML = "";
    if (!attachments.length) { attachEl.hidden = true; return; }
    attachEl.hidden = false;
    attachments.forEach(function (a, i) {
      var chip = document.createElement("div");
      chip.className = "attach-chip";
      var img = document.createElement("img");
      img.src = "data:" + a.mediaType + ";base64," + a.data;
      var name = document.createElement("span");
      name.className = "aname";
      name.textContent = a.name || (a.mediaType.replace("image/", "") + " 图片");
      var x = document.createElement("span");
      x.className = "ax";
      x.textContent = "×";
      x.onclick = function (idx) { return function () { attachments.splice(idx, 1); renderAttachments(); }; }(i);
      chip.appendChild(img); chip.appendChild(name); chip.appendChild(x);
      attachEl.appendChild(chip);
    });
  }
  inputEl.addEventListener("paste", function (e) {
    var items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    var got = false;
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (it.kind === "file" && it.type && /^image\/(png|jpeg|webp|gif)$/.test(it.type)) {
        var file = it.getAsFile();
        if (!file) continue;
        got = true;
        var reader = new FileReader();
        reader.onload = (function (f, mt) { return function () {
          var result = String(reader.result || "");
          var comma = result.indexOf(",");
          if (comma < 0) return;
          attachments.push({ mediaType: mt, data: result.slice(comma + 1), name: f.name || "" });
          renderAttachments();
        }; })(file, it.type);
        reader.readAsDataURL(file);
      }
    }
    if (got) e.preventDefault();
  });

  function send() {
    var text = inputEl.value.trim();
    if (!text && attachments.length === 0) return;
    // While the agent is running, Enter queues the message (harness queue);
    // cap the pending queue at 4.
    if (text && state.running) {
      var queued = state.queue.filter(function (it) { return it.placement === "queued"; }).length;
      if (queued >= 4) {
        statusEl.textContent = "队列已满（最多 4 条）";
        return;
      }
    }
    hideMenu();
    if (text) {
      state.items.push({ kind: "user", text: text, pending: true, turn: state.lastTurn });
      scheduleRender();
    }
    post({ type: "send", text: text, attachments: attachments.slice(), mode: "queue" });
    history.push(text || ("📷 " + attachments.length + " 张图片"));
    if (history.length > 200) history.shift();
    historyIndex = -1;
    historyDraft = "";
    attachments = [];
    renderAttachments();
    inputEl.value = "";
    autoGrow();
  }
  cancelBtn.addEventListener("click", function () { post({ type: "cancel" }); });
  selEl.addEventListener("change", function () {
    if (selEl.value) post({ type: "selectSession", sessionId: selEl.value });
  });
  $("new-session").addEventListener("click", function () { post({ type: "newSession" }); });

  post({ type: "ready" });
})();
</script>
</body>
</html>
