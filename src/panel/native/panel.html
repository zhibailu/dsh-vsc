<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data: vscode-webview-resource:;">
<title>DSH</title>
<style>
  :root {
    --fg: var(--vscode-editor-foreground, #d4d4d4);
    --bg: var(--vscode-sideBar-background, #1e1e1e);
    --muted: var(--vscode-descriptionForeground, #9d9d9d);
    --border: var(--vscode-widget-border, #454545);
    --accent: var(--vscode-button-background, #0e639c);
    --accent-fg: var(--vscode-button-foreground, #ffffff);
    --input-bg: var(--vscode-input-background, #3c3c3c);
    --err: var(--vscode-errorForeground, #f14c4c);
    --ok: #4ec9b0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--fg);
         font-family: var(--vscode-font-family); font-size: var(--vscode-font-size, 13px); overflow: hidden; }

  header { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-bottom: 1px solid var(--border); flex: none; }
  /* connection dot — compact: no text, color carries the state */
  .pill { flex: none; width: 10px; height: 10px; border-radius: 50%; font-size: 0; }
  .pill.on { background: var(--ok); }
  .pill.off { background: var(--err); }
  .pill.busy { background: #e0b94a; }
  .pill.loading { background: var(--muted); }
  #session-select { flex: 1; min-width: 0; background: var(--input-bg); color: var(--fg);
                    border: 1px solid var(--border); border-radius: 2px; padding: 2px 4px; font-size: 12px; }
  #new-session { flex: none; width: 24px; height: 24px; border: 1px solid var(--border); border-radius: 2px;
                 background: transparent; color: var(--fg); cursor: pointer; }
  #new-session:hover { background: var(--input-bg); }
  #delete-session { flex: none; width: 24px; height: 24px; border: 1px solid var(--border); border-radius: 2px;
                    background: transparent; color: var(--fg); cursor: pointer; font-size: 12px; line-height: 1; }
  #delete-session:hover { background: var(--input-bg); }
  #delete-session[data-arm="1"] { color: var(--err); border-color: var(--err); font-size: 11px; }
  #model-select, #effort-select, #preset-select { flex: none; max-width: 110px; background: var(--input-bg); color: var(--fg);
                   border: 1px solid var(--border); border-radius: 2px; padding: 2px 4px; font-size: 12px; }

  #attach-row { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 4px; }
  #attach-row[hidden] { display: none; } /* explicit display overrides [hidden]; re-assert */
  .attach-chip { display: flex; align-items: center; gap: 4px; max-width: 180px; border: 1px solid var(--border);
                 border-radius: 3px; padding: 2px 4px; background: var(--input-bg); font-size: 11px; }
  .attach-chip img { width: 22px; height: 22px; object-fit: cover; border-radius: 2px; flex: none; }
  .attach-chip .aname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .attach-chip .ax { cursor: pointer; color: var(--err); font-weight: 700; padding: 0 2px; }

  #messages { flex: 1; overflow-y: auto; padding: 8px 10px; }
  #history-sentinel { height: 1px; }
  .turn-sep { display: flex; align-items: center; gap: 8px; margin: 14px 0 8px; color: var(--muted); font-size: 11px; }
  .turn-sep::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  /* turn summary strip — pinned to the END of a finished turn, so the totals
     (用时 + +N-M) are visible right where the newest content is, without
     scrolling back up to the turn's start separator */
  .turn-summary { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 10px 0 14px;
                  padding-top: 6px; border-top: 1px solid var(--border); color: var(--muted); font-size: 11px; }
  .turn-summary .check { color: var(--ok); font-weight: 700; }
  .turn-summary details.turn-diff { flex-basis: 100%; margin-top: 2px; }
  .turn-diff summary { cursor: pointer; user-select: none; color: var(--muted); font-size: 11px; padding: 2px 0; }
  .turn-diff summary:hover { color: var(--fg); }
  .turn-diff .td-file { display: flex; align-items: center; gap: 6px; padding: 2px 0 2px 14px; cursor: pointer; border-radius: 2px; }
  .turn-diff .td-file:hover { background: rgba(128, 128, 128, .08); }
  .turn-diff .td-path { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .msg { margin: 6px 0; line-height: 1.55; word-wrap: break-word; }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .body { max-width: 92%; background: var(--input-bg); border: 1px solid var(--border);
                    border-radius: 6px; padding: 6px 10px; white-space: pre-wrap; }
  .msg.assistant .body { white-space: pre-wrap; }
  .msg .body pre { margin: 4px 0; padding: 6px 8px; background: var(--input-bg); border-radius: 3px;
    white-space: pre-wrap; word-break: break-all; font-family: var(--vscode-editor-font-family, monospace); font-size: 12px; }
  .msg .body code { word-break: break-all; }
  .reasoning { border-left: 2px solid var(--border); padding: 2px 10px; color: var(--muted); margin: 4px 0; }
  .reasoning-head { cursor: pointer; user-select: none; font-size: 12px; color: var(--muted); }
  .reasoning-head:hover { color: var(--fg); }
  .reasoning-body { margin: 4px 0; white-space: pre-wrap; max-height: 240px; overflow-y: auto; }
  .reasoning-body[hidden] { display: none; }
  .reasoning-body pre { margin: 4px 0; white-space: pre-wrap; font-family: inherit; font-size: 12px; }
  .msg .stream-cursor::after { content: "▍"; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .tool { border: 1px solid var(--border); border-radius: 4px; margin: 6px 0; overflow: hidden; }
  .tool summary { cursor: pointer; user-select: none; padding: 4px 8px; display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .tool .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .tool .dot.run { background: #e0b94a; animation: blink 1s infinite; }
  .tool .dot.ok { background: var(--ok); }
  .tool .dot.err { background: var(--err); }
  .tool .tname { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  /* tool group: consecutive internal tool calls bundled behind one fold —
     open the group, then open an individual tool to see its args/result */
  .tool-group { border: 1px solid var(--border); border-radius: 4px; margin: 6px 0; overflow: hidden; }
  .tool-group > summary { cursor: pointer; user-select: none; padding: 4px 8px; font-size: 12px;
                          display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .tool-group > summary:hover { color: var(--fg); }
  .tool-group > summary .g-title { font-weight: 600; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tool-group > summary::after { content: "▸"; margin-left: auto; opacity: .7; }
  .tool-group[open] > summary::after { content: "▾"; }
  .tool-group .g-body { border-top: 1px solid var(--border); }
  .tool-group .tool { border: none; border-radius: 0; margin: 0; border-top: 1px solid var(--border); }
  .tool-group .tool:first-child { border-top: none; }
  .tool .targs { padding: 0 8px 6px; }
  .tool .tlabel { font-size: 11px; color: var(--muted); margin: 4px 0 2px; }
  .tool pre { margin: 4px 0; padding: 6px 8px; background: var(--input-bg); border-radius: 3px;
              white-space: pre-wrap; word-break: break-all; font-family: var(--vscode-editor-font-family, monospace); font-size: 12px;
              position: relative; padding-right: 56px; }

  /* bridge metrics: "+N-M" diff chips (always visible on the fold row) and
     the live per-round timer (only on the currently running round) */
  .diff-chip { display: inline-flex; align-items: baseline; gap: 3px; margin-left: 6px;
               font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums;
               user-select: none; white-space: nowrap; vertical-align: middle; }
  .diff-chip .da { color: var(--vscode-gitDecoration-addedResourceForeground, #89d185); }
  .diff-chip .dd { color: var(--vscode-gitDecoration-deletedResourceForeground, #f48771); }
  .diff-chip.pop .da, .diff-chip.pop .dd { animation: chip-pop .4s ease; }
  @keyframes chip-pop { 0% { transform: scale(1.45); } 100% { transform: scale(1); } }
  .live-timer { margin-left: 6px; font-size: 11px; color: #e0b94a; font-weight: 600;
                font-variant-numeric: tabular-nums; white-space: nowrap; vertical-align: middle; }
  .turn-sep .live-timer { color: var(--muted); font-weight: 400; }
  .turn-total { color: var(--muted); font-weight: 400; }

  /* markdown tables (GFM, mirrors web GUI) */
  .md-table { overflow-x: auto; margin: 6px 0; border: 1px solid var(--border); border-radius: 3px; }
  .md-table table { border-collapse: collapse; width: 100%; font-size: 12px; }
  .md-table th, .md-table td { border: 1px solid var(--border); padding: 4px 8px; text-align: left;
                                white-space: nowrap; word-break: normal; }
  .md-table th { background: var(--input-bg); font-weight: 600; position: sticky; top: 0; }
  .md-table td { white-space: pre-wrap; word-break: break-word; }

  /* markdown headings / em / del (the panel's markdown-lite output) */
  .md-h1, .md-h2, .md-h3, .md-h4, .md-h5, .md-h6 { margin: 10px 0 4px; font-weight: 700; line-height: 1.35; }
  .md-h1 { font-size: 17px; } .md-h2 { font-size: 15px; } .md-h3 { font-size: 14px; }
  .md-h4, .md-h5, .md-h6 { font-size: 13px; }
  .body em { font-style: italic; }
  .body del { color: var(--muted); }

  /* block-level copy buttons (markdown code blocks + tool args/result) */
  pre.md-code { position: relative; padding-right: 56px; }
  .block-copy { position: absolute; top: 4px; right: 4px; z-index: 5;
                background: var(--input-bg); color: var(--muted); border: 1px solid var(--border);
                border-radius: 3px; font-size: 10px; padding: 1px 6px; cursor: pointer; opacity: .85; }
  .block-copy:hover { color: var(--fg); border-color: var(--accent); opacity: 1; }

  .sys-err { margin: 6px 0; padding: 6px 10px; border-left: 3px solid var(--err); color: var(--err); white-space: pre-wrap; font-size: 12px; }
  .cmd-note { margin: 6px 0; padding: 4px 10px; border-left: 3px solid var(--ok); color: var(--muted); font-size: 12px; white-space: pre-wrap; }
  .empty { color: var(--muted); text-align: center; margin-top: 40px; font-size: 12px; line-height: 2; }
  .empty.offline { color: var(--err); }
  .loading { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 72px; color: var(--muted); }
  .loading .whale { width: 60px; opacity: .9; animation: whale-bob 2.4s ease-in-out infinite; }
  .loading .loading-text { font-size: 15px; letter-spacing: .05em; color: var(--fg); }
  @keyframes whale-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .pill.loading { background: rgba(148, 163, 184, .15); color: var(--muted); }

  footer { flex: none; position: relative; border-top: 1px solid var(--border); padding: 6px 8px; }
  #mention-menu { position: absolute; bottom: 100%; left: 8px; right: 8px; max-height: 40vh; overflow-y: auto;
    background: var(--vscode-quickInput-background, var(--input-bg)); color: var(--fg);
    border: 1px solid var(--border); border-radius: 4px; z-index: 20; font-size: 12px;
    box-shadow: 0 4px 12px rgba(0,0,0,.35); }
  .m-item { padding: 4px 8px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m-item.sel { background: var(--vscode-list-activeSelectionBackground, #094771);
                color: var(--vscode-list-activeSelectionForeground, #ffffff); }
  .m-item.hint { color: var(--muted); cursor: default; }
  .m-kind { opacity: .5; margin-right: 2px; }
  .m-path { opacity: .6; margin-left: 8px; font-size: 11px; }
  .m-crumbs { padding: 4px 8px; border-bottom: 1px solid var(--border); color: var(--muted);
              font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m-crumbs span { cursor: pointer; }
  .m-crumbs span:hover { color: var(--fg); text-decoration: underline; }
  .m-crumbs span.cur { color: var(--fg); cursor: default; }
  #input-status { font-size: 11px; color: var(--muted); min-height: 16px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #input-row { display: flex; gap: 6px; align-items: flex-end; }
  #input-row[hidden] { display: none; } /* explicit display wins over [hidden]'s default; re-assert it */
  #input { flex: 1; resize: none; background: var(--input-bg); color: var(--fg); border: 1px solid var(--border);
           border-radius: 3px; padding: 6px 8px; font-family: inherit; font-size: 13px; max-height: 180px; }
  #input:focus { outline: 1px solid var(--accent); }
  .btn { width: 28px; height: 28px; border: 1px solid var(--border); border-radius: 3px; background: transparent; color: var(--fg); cursor: pointer; flex: none; }
  .btn:hover { background: var(--input-bg); }
  .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
  .btn.primary:disabled { opacity: .5; cursor: default; }
  #cancel { color: var(--err); }

  #queue-row { display: flex; flex-direction: column; gap: 4px; padding-bottom: 4px; }
  .q-item { display: flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: 3px;
            padding: 3px 6px; background: var(--input-bg); font-size: 12px; }
  .q-item .qtag { font-size: 10px; color: var(--muted); flex: none; }
  .q-item .qtext { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg); }
  .q-item .qbtn { flex: none; cursor: pointer; color: var(--muted); padding: 0 3px; border: none; background: none; font-size: 11px; }
  .q-item .qbtn:hover { color: var(--fg); }
  .q-item .qbtn.danger:hover { color: var(--err); }

  .msg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 2px; }
  .msg-actions button { cursor: pointer; background: none; border: none; color: var(--muted); font-size: 11px; padding: 0 2px; }
  .msg-actions button:hover { color: var(--fg); }
  .edit-box { width: 100%; box-sizing: border-box; background: var(--input-bg); color: var(--fg);
              border: 1px solid var(--accent); border-radius: 3px; padding: 6px 8px;
              font-family: inherit; font-size: 13px; resize: vertical; min-height: 60px; }

  /* task bar (todos projection) — sits just above the input row */
  #todo-bar { padding: 2px 8px; background: rgba(128,128,128,.06); }
  #todo-bar[hidden] { display: none; }
  #todo-toggle { cursor: pointer; user-select: none; font-size: 12px; color: var(--fg); background: none;
                 border: none; padding: 2px 0; font-family: inherit; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  #todo-toggle:hover { color: var(--accent); }
  #todo-toggle .tcount { color: var(--muted); font-weight: 400; }
  #todo-toggle .tcount b { color: #e0b94a; font-weight: 600; }
  #todo-toggle .tchevron, #todo-chevron { color: var(--muted); font-size: 10px; }
  #todo-list { margin: 2px 0 4px; padding: 0; list-style: none; max-height: 120px; overflow-y: auto;
               border: 1px solid var(--border); border-radius: 3px; background: var(--input-bg); }
  #todo-list[hidden] { display: none; }
  .t-item { display: flex; align-items: flex-start; gap: 6px; padding: 3px 8px; font-size: 12px; line-height: 1.45; }
  .t-item + .t-item { border-top: 1px solid var(--border); }
  .t-item .tmark { flex: none; width: 14px; text-align: center; font-size: 12px; }
  .t-item.pending .tmark { color: var(--muted); }
  .t-item.in_progress .tmark { color: #e0b94a; }
  .t-item.completed .tmark { color: var(--ok); }
  .t-item.completed .ttext { color: var(--muted); text-decoration: line-through; }
  .t-item.in_progress .ttext { color: var(--fg); }
  .t-item .ttext { flex: 1; word-wrap: break-word; }
  .todo-empty { color: var(--muted); font-size: 11px; padding: 2px 0; }

  /* ask card — in-panel "ask about selection" (sits just above the input row) */
  #ask-card { padding: 6px 8px; background: rgba(128,128,128,.06); border-top: 1px solid var(--border); }
  #ask-card[hidden] { display: none; }
  .ask-head { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; margin-bottom: 4px; }
  .ask-close { margin-left: auto; background: none; border: none; color: var(--muted); cursor: pointer;
               font-size: 12px; padding: 0 2px; font-family: inherit; }
  .ask-close:hover { color: var(--fg); }
  .ask-ctx { font-size: 11px; color: var(--muted); max-height: 64px; overflow-y: auto; word-break: break-all;
             white-space: pre-wrap; border: 1px solid var(--border); border-radius: 3px;
             background: var(--input-bg); padding: 4px 6px; margin-bottom: 6px; }
  .ask-choices { display: flex; flex-wrap: wrap; gap: 4px; }
  .ask-choice { background: var(--input-bg); color: var(--fg); border: 1px solid var(--border);
                border-radius: 3px; padding: 3px 8px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .ask-choice:hover { border-color: var(--accent); color: var(--accent); }
  .ask-custom-row { display: flex; gap: 4px; margin-top: 6px; }
  .ask-custom-row[hidden] { display: none; }
  #ask-custom-input { flex: 1; background: var(--input-bg); color: var(--fg); border: 1px solid var(--accent);
                      border-radius: 3px; padding: 4px 6px; font-family: inherit; font-size: 12px; }
  .ask-send { background: var(--accent); color: var(--bg); border: none; border-radius: 3px;
              padding: 3px 10px; font-size: 12px; cursor: pointer; font-family: inherit; }

  /* interaction card — approval / question (agent asked the human) */
  #interact-card { padding: 8px 10px; background: rgba(128,128,128,.05); border-top: 1px solid var(--border); }
  #interact-card[hidden] { display: none; }
  .in-card { border: 1px solid var(--border); border-radius: 8px; background: var(--input-bg);
             padding: 10px 12px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .in-head { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; margin-bottom: 6px; }
  .in-tag { font-size: 10px; padding: 1px 7px; border-radius: 8px; background: rgba(224,185,74,.18); color: #e0b94a;
            flex: none; }
  .in-tag.approval { background: rgba(244,76,76,.15); color: var(--err); }
  .in-ctx { font-size: 12px; color: var(--fg); line-height: 1.5; word-break: break-word;
            white-space: pre-wrap; margin: 4px 0 8px; }
  .in-ctx .in-tool { color: var(--accent); font-weight: 600; }
  .in-q { margin-bottom: 10px; }
  .in-q:last-of-type { margin-bottom: 4px; }
  .in-q .in-qtext { font-size: 13px; color: var(--fg); line-height: 1.5; margin-bottom: 2px; }
  .in-q .in-qhead { display: flex; align-items: flex-start; gap: 8px; }
  .in-q .in-qhead .in-qtext { flex: 1; }
  .in-skip { flex: none; background: none; border: none; color: var(--muted); cursor: pointer;
             font-size: 11px; padding: 2px 4px; border-radius: 4px; font-family: inherit; margin-top: -2px; }
  .in-skip:hover { color: var(--accent); background: rgba(128,128,128,.08); }
  .in-q.skipped .in-qtext { color: var(--muted); text-decoration: line-through; }
  .in-q.skipped .in-opt { opacity: .45; pointer-events: none; }
  .in-q.skipped .in-skip { color: var(--ok); }
  .in-q .in-qheader { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px;
                      margin-bottom: 2px; }
  .in-q .in-qdetail { font-size: 11px; color: var(--muted); white-space: pre-wrap; margin-bottom: 6px; }
  /* Options stack vertically — one option per full-width row; label + badge on
     one line, description under it. Single-select shows a number chip, multi a
     checkbox (mirrors the web question composer). */
  .in-opts { display: flex; flex-direction: column; gap: 5px; }
  .in-opt { display: flex; align-items: flex-start; gap: 8px; width: 100%; text-align: left;
            background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 6px;
            padding: 6px 9px; font-size: 12px; line-height: 1.45; cursor: pointer; font-family: inherit; }
  .in-opt:hover { border-color: var(--accent); }
  .in-opt.sel { border-color: var(--accent); background: rgba(78,201,176,.07); }
  .in-opt .in-num { flex: none; width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--border);
                    display: inline-flex; align-items: center; justify-content: center; font-size: 11px;
                    color: var(--muted); margin-top: 1px; }
  .in-opt.sel .in-num { border-color: var(--accent); color: var(--accent); background: rgba(78,201,176,.1); }
  .in-opt .in-check { flex: none; width: 16px; height: 16px; border-radius: 3px; border: 1px solid var(--border);
                      display: inline-flex; align-items: center; justify-content: center; font-size: 11px;
                      color: var(--bg); margin-top: 1px; }
  .in-opt.sel .in-check { border-color: var(--accent); background: var(--accent); color: var(--bg); }
  .in-opt .in-ocopy { flex: 1; min-width: 0; }
  .in-opt .in-oline { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .in-opt .in-olabel { word-break: break-word; }
  .in-opt .in-badge { font-size: 10px; padding: 0 6px; border-radius: 8px; background: rgba(78,201,176,.16);
                      color: var(--ok); flex: none; font-weight: 600; }
  .in-opt .in-odesc { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; word-break: break-word; }
  .in-actions { display: flex; gap: 6px; margin-top: 10px; align-items: center; }
  .in-btn { background: var(--input-bg); color: var(--fg); border: 1px solid var(--border); border-radius: 6px;
            padding: 5px 14px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .in-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .in-btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
  .in-btn.primary:hover:not(:disabled) { filter: brightness(1.15); color: var(--accent-fg); }
  .in-btn.danger { background: rgba(244,76,76,.12); color: var(--err); border-color: var(--err); }
  .in-btn.danger:hover:not(:disabled) { background: rgba(244,76,76,.2); }
  .in-btn:disabled { opacity: .4; cursor: default; }
  .in-spacer { flex: 1; }
  .in-custom-row { display: flex; gap: 6px; margin-top: 8px; align-items: center;
                   border: 1px solid var(--border); border-radius: 6px; padding: 0 8px;
                   background: var(--bg); }
  .in-custom-row:focus-within { border-color: var(--accent); }
  .in-custom-icon { flex: none; color: var(--muted); font-size: 12px; }
  #in-custom-input { flex: 1; background: transparent; color: var(--fg); border: none;
                     padding: 6px 0; font-family: inherit; font-size: 12px; outline: none; }
</style>
</head>
<body>
  <header>
    <span id="pill" class="pill off" title="DSH Bridge: 正在加载…"></span>
    <select id="session-select" title="切换会话"></select>
    <select id="model-select" title="切换模型" hidden></select>
    <select id="effort-select" title="推理等级" hidden></select>
    <select id="preset-select" title="权限预设" hidden></select>
    <button id="new-session" title="新会话">＋</button>
    <button id="delete-session" title="删除当前会话">🗑</button>
  </header>
  <main id="messages"><div id="history-sentinel"></div></main>
  <footer>
    <div id="mention-menu" hidden></div>
    <div id="attach-row" hidden></div>
    <div id="queue-row" hidden></div>
    <section id="todo-bar" hidden>
      <button id="todo-toggle" title="展开/折叠任务">☑ 任务 <span class="tcount" id="todo-count"></span> <span id="todo-chevron">▸</span></button>
      <ul id="todo-list" hidden></ul>
    </section>
    <section id="ask-card" hidden>
      <div class="ask-head">✎ Ask DSH <button class="ask-close" id="ask-close" title="关闭">✕</button></div>
      <div class="ask-ctx" id="ask-ctx"></div>
      <div class="ask-choices" id="ask-choices"></div>
      <div class="ask-custom-row" id="ask-custom-row" hidden>
        <input id="ask-custom-input" placeholder="输入指令…（Enter 发送）" />
        <button class="ask-send" id="ask-send">➤</button>
      </div>
    </section>
    <section id="interact-card" hidden></section>
    <div id="input-row">
      <textarea id="input" rows="1" placeholder="发消息…（Enter 发送，运行中自动排队；Shift+Enter 换行；Ctrl+V 粘图片）"></textarea>
      <button id="send" class="btn primary" title="发送">➤</button>
      <button id="cancel" class="btn" title="停止当前回合" hidden>✕</button>
    </div>
    <div id="input-status"></div>
  </footer>
<script>
(function () {
  "use strict";
  var vscode = acquireVsCodeApi();
  var $ = function (id) { return document.getElementById(id); };
  var messagesEl = $("messages"), pillEl = $("pill"), selEl = $("session-select"),
      modelEl = $("model-select"), effortEl = $("effort-select"), presetEl = $("preset-select"),
      attachEl = $("attach-row"), queueEl = $("queue-row"),
      inputEl = $("input"), sendBtn = $("send"), cancelBtn = $("cancel"), statusEl = $("input-status"),
      todoBarEl = $("todo-bar"), todoToggleEl = $("todo-toggle"), todoListEl = $("todo-list"),
      todoCountEl = $("todo-count"), todoChevronEl = $("todo-chevron"),
      askCardEl = $("ask-card"), askCtxEl = $("ask-ctx"), askChoicesEl = $("ask-choices"),
      askCloseEl = $("ask-close"), askCustomRowEl = $("ask-custom-row"),
      askCustomInputEl = $("ask-custom-input"), askSendEl = $("ask-send"),
      interactEl = $("interact-card"),
      sentinelEl = $("history-sentinel");

  var state = {
    connected: false, version: null, phase: "searching",
    sessions: [], activeSessionId: null,
    items: [], seqs: new Set(), oldestSeq: Infinity,
    running: false, lastTurn: -1,
    dirtySync: false,       // one unfrozen render right after turn/end
    curAssistant: null, openBlocks: [],
    titles: {},
    models: null,            // { current: {provider, model}, groups: [...] }
    presets: [],             // permission presets (projections.permissions): [{value,label}]
    permCurrent: "",         // active session's current permission value
    interact: null,          // pending interaction card {rpcId, kind, ...} | null
    usage: null,             // active session tokenUsage projection
    queue: [],               // session/queue snapshot for the active session
    commands: [],            // slash-command catalog (commands/list)
    todos: [],               // todos projection for the active session
    todoCache: null,         // { sessionId, items } — latest todos seen, survives session switches
    todoOpen: false,         // task-bar expanded?
    hasMore: false,          // older history pages available
    loadingOlder: false,     // a loadOlder request is in flight
    turnStart: 0, firstTokenAt: 0, turnOutput: 0,
    diffByCall: {},          // callId -> {added, deleted} (bridge-computed "+N-M")
    turnStartTime: 0,        // epoch ms of the current turn/start event
    turnStartPerf: 0,        // performance.now() at the current turn/start
    activeRound: null,       // {kind:"tool", callId} | {kind:"assistant"} | null
    nextItemId: 1            // stable per-item ids (reasoning fold state, etc.)
  };

  function post(msg) { try { vscode.postMessage(msg); } catch (e) {} }
  function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function relTime(ts) {
    if (!ts) return "";
    var diff = Date.now() - ts;
    if (diff < 60e3) return "刚刚";
    if (diff < 3600e3) return Math.floor(diff / 60e3) + "分钟前";
    if (diff < 86400e3) return Math.floor(diff / 3600e3) + "小时前";
    if (diff < 172800e3) return "昨天";
    if (diff < 604800e3) return Math.floor(diff / 86400e3) + "天前";
    var d = new Date(ts);
    return (d.getMonth() + 1) + "-" + d.getDate();
  }
  function shortId(id) { return String(id || "").replace(/^session-/, "").slice(0, 8); }

  /* ---------- markdown-lite ---------- */
  function renderInline(text) {
    return esc(text)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\*([^*\n]+)\*/g, "<em>$1</em>")
      .replace(/~~([^~\n]+)~~/g, "<del>$1</del>");
  }
  /** GFM table separator line check: a row of |---| (optionally :aligned:). */
  function isTableSeparator(line) {
    var cells = line.trim().replace(/^\||\|$/g, "").split("|");
    if (cells.length < 2) return false;
    return cells.every(function (c) { return /^\s*:?-+:?\s*$/.test(c.trim()); });
  }
  function renderTable(rows) {
    var header = rows[0];
    var split = function (line) {
      return line.trim().replace(/^\||\|$/g, "").split("|").map(function (c) { return c.trim(); });
    };
    var head = split(header);
    // rows = [header, dataRow, ...]; the |---| separator may or may not be
    // present at index 1 depending on caller — skip it if so.
    var body = rows.slice(1);
    if (body.length > 0 && isTableSeparator(body[0])) body = body.slice(1);
    var html = "<div class='md-table'><table><thead><tr>";
    for (var h = 0; h < head.length; h++) html += "<th>" + renderInline(head[h]) + "</th>";
    html += "</tr></thead><tbody>";
    for (var r = 0; r < body.length; r++) {
      var cells = split(body[r]);
      html += "<tr>";
      for (var c = 0; c < head.length; c++) html += "<td>" + renderInline(cells[c] || "") + "</td>";
      html += "</tr>";
    }
    html += "</tbody></table></div>";
    return html;
  }
  /** Line-based markdown-lite renderer.
   *  Walks lines left to right and classifies each into:
   *   - fenced code block (``` ... ```)   -> <pre class='md-code'>
   *   - GFM table (header + |---| sep)    -> <table>
   *   - ATX heading (# .. ######)         -> <div class='md-hN'>
   *   - ordinary text                     -> renderInline
   *  Spacing rule (matches web markdown): BLOCK elements (pre/table/heading)
   *  separate by their own margins — they emit NO trailing "\n" (the .body
   *  is pre-wrap, so a bare newline after a block would double the gap into
   *  a visible blank row). Text paragraphs separate by one "\n" between
   *  adjacent text lines; a blank line between two TEXT lines is one "\n".
   *  Line-first ordering keeps a ``` inside a table cell from splitting the
   *  table, and a | inside a code block from faking a table. */
  function isBlockAt(lines, idx) {
    if (idx >= lines.length) return false;
    var tl = lines[idx].trim();
    if (tl.indexOf("```") === 0) return true;
    if (tl.indexOf("|") !== -1 && idx + 1 < lines.length && isTableSeparator(lines[idx + 1])) return true;
    return /^(#{1,6})\s+/.test(tl);
  }
  function renderText(text) {
    var lines = String(text).split("\n");
    var out = "";
    var lastKind = "none"; // last emitted: "text" | "block" | "none"
    var i = 0;
    while (i < lines.length) {
      var line = lines[i];
      var t = line.trim();
      // fenced code block
      if (t.indexOf("```") === 0) {
        var lang = t.slice(3).trim();
        var buf = [];
        i++;
        while (i < lines.length && lines[i].trim().indexOf("```") !== 0) { buf.push(lines[i]); i++; }
        i++; // closing fence
        var code = esc(buf.join("\n"));
        out += "<pre class='md-code'><code" + (lang ? " data-lang='" + esc(lang) + "'" : "") + ">" + code + "</code>"
             + "<button class='block-copy' title='复制代码'>⧉ 复制</button></pre>";
        lastKind = "block";
        continue;
      }
      // GFM table: header + separator line
      if (t.indexOf("|") !== -1 && i + 1 < lines.length && isTableSeparator(lines[i + 1])) {
        var rows = [line];
        i += 2;
        while (i < lines.length && lines[i].indexOf("|") !== -1) { rows.push(lines[i]); i++; }
        out += renderTable(rows);
        lastKind = "block";
        continue;
      }
      // ATX heading: # .. ###### (web GUI renders the same)
      var hm = /^(#{1,6})\s+(.+)$/.exec(t);
      if (hm) {
        var lvl = hm[1].length;
        out += "<div class='md-h" + lvl + "'>" + renderInline(hm[2]) + "</div>";
        lastKind = "block";
        i++;
        continue;
      }
      // blank line: paragraph gap ONLY between two text lines (blocks use margins)
      if (t === "") {
        var j = i;
        while (j < lines.length && lines[j].trim() === "") j++;
        if (lastKind === "text" && j < lines.length && !isBlockAt(lines, j)) out += "\n";
        i = j;
        continue;
      }
      // ordinary line: ends with "\n" whenever more lines follow (the blank
      // line handler adds the SECOND "\n" between text paragraphs, so two
      // text lines separated by an empty line render as one blank row —
      // exactly like web markdown's <p> margins).
      out += renderInline(line);
      lastKind = "text";
      i++;
      if (i < lines.length) out += "\n";
    }
    return out;
  }

  /* ---------- helpers on event payloads ---------- */
  function blocksOf(message) { return (message && message.content) || []; }
  function textBlocksOf(message) {
    return blocksOf(message).filter(function (b) { return b && b.type === "text"; })
      .map(function (b) { return b.text; }).join("");
  }
  function contentBlocks(message) {
    return blocksOf(message).filter(function (b) {
      return b && (b.type === "text" || b.type === "reasoning");
    }).map(function (b) {
      return { type: b.type, text: String(b.text || "") };
    });
  }
  function prettyArgs(s) {
    try { return JSON.stringify(JSON.parse(s), null, 2); } catch (e) { return String(s || ""); }
  }
  function summarizeResult(content) {
    var parts = [];
    (content || []).forEach(function (b) {
      if (b && typeof b.text === "string") parts.push(b.text);
      else if (b && b.type === "tool-result" && Array.isArray(b.content)) parts.push(summarizeResult(b.content));
    });
    var s = parts.join("\n").trim();
    return s.length > 1500 ? s.slice(0, 1500) + "\n…（截断）" : s;
  }

  /* ---------- fold: events -> render items ---------- */
  function finalizeStream() {
    if (state.curAssistant) {
      state.curAssistant.streaming = false;
      state.curAssistant.version = (state.curAssistant.version || 0) + 1;
      state.curAssistant = null;
    }
    state.openBlocks = [];
  }
  /** Cancel-safe turn end: DSH's cancel() stops the turn WITHOUT a turn/end
   *  event, so the running clock (and every live timer) would otherwise keep
   *  counting forever. Called when the host reports running:false; stops all
   *  timers and leaves the final summary to a real turn/end if it ever lands. */
  function softEndTurn() {
    finalizeStream();
    state.activeRound = null;
    for (var i = state.items.length - 1; i >= 0; i--) {
      var it = state.items[i];
      // Running tool calls that never got a result keep their live timer —
      // mark them done and force a partial update so syncToolEl drops it
      // once activeRound is null.
      if (it.kind === "tool" && it.status === "running") {
        it.status = "ok";
        it.version = (it.version || 0) + 1;
      } else if (it.kind === "turn" && !it.done) {
        it.done = true;
        it.endTime = Date.now();
        if (it.startTime) it.elapsed = Math.max(0, it.endTime - it.startTime);
        it.totalDiff = aggregateTurnDiff(state.items, it.turn);
        it.version = (it.version || 0) + 1;
        break;
      }
    }
    scheduleRender();
  }
  function ensureAssistant() {
    if (!state.curAssistant) {
      state.curAssistant = { kind: "assistant", blocks: [], done: false, streaming: true, startPerf: performance.now() };
      state.items.push(state.curAssistant);
    }
  }
  function syncAssistantFromBlocks() {
    if (!state.curAssistant) return;
    state.curAssistant.blocks = state.openBlocks
      .filter(function (b) { return b && b.text; })
      .map(function (b) { return { type: b.type, text: b.text }; });
  }
  function findTool(callId) {
    // Normalize to string: tool/call stores String(callId) while tool/result's
    // toolCallId can arrive as a number — a strict compare would miss the
    // match and leave the card "running" with a live timer forever.
    var cid = String(callId);
    for (var i = state.items.length - 1; i >= 0; i--) {
      if (state.items[i].kind === "tool" && state.items[i].callId === cid) return state.items[i];
    }
    return null;
  }

  function applyEvent(ev) {
    if (ev && typeof ev.seq === "number") {
      if (state.seqs.has(ev.seq)) return;
      state.seqs.add(ev.seq);
      if (ev.seq < state.oldestSeq) state.oldestSeq = ev.seq;
    }
    var d = (ev && ev.data) || {};
    switch (ev && ev.type) {
      case "turn/start":
        finalizeStream();
        state.lastTurn = typeof d.turn === "number" ? d.turn : state.lastTurn + 1;
        state.turnStart = performance.now(); state.firstTokenAt = 0; state.turnOutput = 0;
        state.turnStartTime = typeof ev.time === "number" ? ev.time : Date.now();
        state.turnStartPerf = performance.now();
        state.activeRound = null;
        // A new round is user-visible content: unfreeze even if the user was
        // reading history, or the whole new round would never render.
        if (suspended) { suspended = false; forceBottom = true; }
        state.items.push({ kind: "turn", turn: state.lastTurn, done: false,
                           startTime: state.turnStartTime, startPerf: state.turnStartPerf });
        break;
      case "user/message": {
        // user/message carries content at data.content (assistant/message wraps
        // it under data.message) — accept either shape.
        var msg = d.message || d;
        var u = textBlocksOf(msg);
        if (u) {
          // Update the newest PENDING user bubble wherever it sits in the
          // list. send() optimistically inserts a pending bubble, and a
          // history replay right after prompt can push a turn item past it —
          // matching only the LAST item would then create a duplicate bubble.
          var pend = null;
          for (var ui = state.items.length - 1; ui >= 0; ui--) {
            if (state.items[ui].kind === "user" && state.items[ui].pending) { pend = state.items[ui]; break; }
          }
          if (pend) { pend.text = u; pend.pending = false; pend.turn = d.turn; pend.version = (pend.version || 0) + 1; }
          else state.items.push({ kind: "user", text: u, turn: d.turn });
        }
        break;
      }
      case "assistant/chunk": {
        var chunk = d.chunk || {};
        ensureAssistant();
        if (chunk.type === "block-start") {
          state.openBlocks[chunk.index] = { type: chunk.blockType || "text", text: "" };
        } else if (chunk.type === "usage") {
          if (chunk.usage && typeof chunk.usage.outputTokens === "number") state.turnOutput = chunk.usage.outputTokens;
        } else if (chunk.type === "text-delta" || chunk.type === "reasoning-delta") {
          // The newest round is now the assistant's reply (its own live timer);
          // a transition from tool→assistant starts a fresh reply round.
          if (state.activeRound === null || state.activeRound.kind !== "assistant") {
            state.activeRound = { kind: "assistant" };
            if (state.curAssistant) state.curAssistant.startPerf = performance.now();
          }
          if (!state.firstTokenAt) state.firstTokenAt = performance.now();
          var b = state.openBlocks[chunk.index] || (state.openBlocks[chunk.index] = { type: chunk.type === "reasoning-delta" ? "reasoning" : "text", text: "" });
          if (chunk.text) b.text += chunk.text;
          syncAssistantFromBlocks();
          if (state.curAssistant) state.curAssistant.version = (state.curAssistant.version || 0) + 1;
        }
        break;
      }
      case "assistant/message": {
        ensureAssistant();
        var finMsg = state.curAssistant;
        finMsg.blocks = contentBlocks(d.message);
        finMsg.done = true;
        finMsg.streaming = false;
        finMsg.version = (finMsg.version || 0) + 1;
        state.curAssistant = null;
        state.openBlocks = [];
        state.activeRound = null;
        break;
      }
      case "tool/call": {
        var callId = String(d.callId || "");
        state.activeRound = { kind: "tool", callId: callId };
        state.items.push({ kind: "tool", callId: callId, name: d.name || "tool",
                           argsText: prettyArgs(d.arguments), status: "running", resultText: "",
                           turn: typeof d.turn === "number" ? d.turn : state.lastTurn,
                           startedPerf: performance.now(),
                           diff: state.diffByCall[callId] || null });
        break;
      }
      case "tool/result": {
        var msg = d.message || {};
        var block = null;
        (msg.content || []).forEach(function (b) { if (b && b.type === "tool-result") block = b; });
        var callId = (block && block.toolCallId) || d.callId;
        var tool = findTool(callId);
        if (tool) {
          tool.status = block && block.isError ? "error" : "ok";
          tool.resultText = summarizeResult(block && block.content);
          tool.version = (tool.version || 0) + 1;
        }
        if (state.activeRound && state.activeRound.kind === "tool" && state.activeRound.callId === String(callId)) {
          state.activeRound = null;
        }
        break;
      }
      case "turn/end": {
        finalizeStream();
        state.activeRound = null;
        // Safety net: if a tool/result failed to match (callId type drift) the
        // card would stay "running" with a live timer forever — close every
        // still-running tool the moment the turn ends.
        for (var ri = state.items.length - 1; ri >= 0; ri--) {
          var rit = state.items[ri];
          if (rit.kind === "tool" && rit.status === "running") {
            rit.status = "ok";
            rit.version = (rit.version || 0) + 1;
          }
        }
        // New turn boundary: always visible, even if the view was frozen while
        // the user was reading history.
        if (suspended) { suspended = false; forceBottom = true; }
        var endTurn = null;
        for (var i = state.items.length - 1; i >= 0; i--) {
          var turnItem = state.items[i];
          if (turnItem.kind === "turn") {
            turnItem.done = true;
            turnItem.endTime = typeof ev.time === "number" ? ev.time : Date.now();
            turnItem.elapsed = turnItem.startTime ? Math.max(0, turnItem.endTime - turnItem.startTime) : undefined;
            turnItem.totalDiff = aggregateTurnDiff(state.items, turnItem.turn);
            turnItem.version = (turnItem.version || 0) + 1;
            endTurn = { turn: turnItem.turn, elapsed: turnItem.elapsed, totalDiff: turnItem.totalDiff };
            break;
          }
        }
        // Bottom-of-turn summary strip: appears the moment the turn ends, so
        // the totals are right under the newest message (no scrolling up).
        if (endTurn) {
          state.items.push({ kind: "turn-end", turn: endTurn.turn, elapsed: endTurn.elapsed, totalDiff: endTurn.totalDiff });
          // The final render of this round must still happen even though the
          // turn-end makes everything frozen: rAF coalescing can delay the
          // last text-delta render past this boundary, and frozen would then
          // lock the card at its pre-text state (missing body, "no text"
          // until reload). Let the NEXT render ignore frozen once.
          state.dirtySync = true;
        }
        break;
      }
      case "session/title":
        if (typeof d.title === "string") { state.titles[state.activeSessionId] = d.title; }
        break;
    }
    scheduleRender();
  }

  /** Map a page of older (already-complete) log events into read-only items
   *  for the infinite-scroll prepend. Old history contains whole messages
   *  (user/message, assistant/message, tool/call+result, turn markers), not
   *  streaming chunks, so a direct mapping is safe and cheap. */
  function olderItemsFrom(events) {
    var out = [];
    var curTool = null;
    events.forEach(function (ev) {
      if (!ev) return;
      var d = ev.data || {};
      switch (ev.type) {
        case "turn/start": {
          var tnum = typeof d.turn === "number" ? d.turn : out.length;
          // If this turn's end strip was already loaded (newer page came
          // first), mark it done right away instead of showing "进行中".
          var preDone = null;
          for (var pi = state.items.length - 1; pi >= 0; pi--) {
            var pit = state.items[pi];
            if (pit.kind === "turn-end" && pit.turn === tnum) { preDone = pit; break; }
          }
          out.push({ kind: "turn", turn: tnum, done: !!preDone,
                     startTime: typeof ev.time === "number" ? ev.time : 0,
                     elapsed: preDone ? preDone.elapsed : undefined });
          break;
        }
        case "turn/end": {
          var doneTurn = null;
          for (var i = out.length - 1; i >= 0; i--) {
            var t = out[i];
            if (t.kind === "turn" && !t.done) {
              t.done = true;
              t.endTime = typeof ev.time === "number" ? ev.time : 0;
              if (t.startTime) t.elapsed = Math.max(0, t.endTime - t.startTime);
              var total = aggregateTurnDiff(out, t.turn);
              t.totalDiff = total;
              doneTurn = { turn: t.turn, elapsed: t.elapsed, totalDiff: total };
              break;
            }
          }
          if (doneTurn) {
            out.push({ kind: "turn-end", turn: doneTurn.turn, elapsed: doneTurn.elapsed, totalDiff: doneTurn.totalDiff });
          }
          break;
        }
        case "user/message": {
          var msg = d.message || d;
          var u = textBlocksOf(msg);

    var whole = Math.floor(s);
    var sec = whole % 60;
    return Math.floor(whole / 60) + "m" + (sec < 10 ? "0" : "") + sec + "s";
  }
  /** Accumulated "+N-M" of the current turn's tool calls (live, jumps as each lands). */
  function turnDiffLive() {
    var a = 0, d = 0;
    for (var i = 0; i < state.items.length; i++) {
      var it = state.items[i];
      if (it.kind === "tool" && it.turn === state.lastTurn && it.diff) {
        a += it.diff.added;
        d += it.diff.deleted;
      }
    }
    return (a || d) ? { added: a, deleted: d } : null;
  }
  /** Aggregate one turn's tool diffs into totals + per-file breakdown. */
  function aggregateTurnDiff(items, turn) {
    var total = { added: 0, deleted: 0, files: [] };
    var byPath = {};
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (it.kind === "tool" && it.turn === turn && it.diff) {
        total.added += it.diff.added;
        total.deleted += it.diff.deleted;
        var p = it.diff.path || "(未知文件)";
        if (!byPath[p]) byPath[p] = { path: p, added: 0, deleted: 0 };
        byPath[p].added += it.diff.added;
        byPath[p].deleted += it.diff.deleted;
      }
    }
    for (var k in byPath) total.files.push(byPath[k]);
    total.files.sort(function (a, b) { return (b.added + b.deleted) - (a.added + a.deleted); });
    return total;
  }
  /** Rebuild-free tick: only the currently rendered live timers move. */
  function tickLive() {
    var now = performance.now();
    if (!state.running) {
      // Turn is over: no live timer may remain anywhere. Safety net for any
      // render path that failed to remove one — the tick wipes them directly
      // so a stale "counting" timer can never survive past the turn.
      var rem = messagesEl.querySelectorAll(".live-timer");
      for (var ri2 = 0; ri2 < rem.length; ri2++) rem[ri2].remove();
      return;
    }
    var els = messagesEl.querySelectorAll(".live-timer");
    for (var i = 0; i < els.length; i++) {
      var st = parseFloat(els[i].getAttribute("data-start") || "0");
      if (st > 0) els[i].textContent = fmtLive(now - st);
    }
    if (state.running && state.turnStartPerf) {
      var seg = document.getElementById("live-status");
      var sst = seg ? parseFloat(seg.getAttribute("data-start") || "0") : 0;
      if (seg && sst > 0) seg.textContent = fmtLive(now - sst);
    }
  }
  setInterval(tickLive, 250);

  function renderItem(item) {
    var el = document.createElement("div");
    if (!item.id) item.id = state.nextItemId++;
    el.dataset.key = String(item.id);
    switch (item.kind) {
      case "turn": {
        el.className = "turn-sep";
        // Totals of a finished turn live on the bottom summary strip
        // (kind "turn-end"), not here — so the newest content shows them
        // without scrolling back up. The running turn keeps the live clock
        // and the accumulated "+N-M" so far.
        var label = "— 第 " + item.turn + " 轮";
        if (!item.done) {
          label += " · 进行中";
          if (item.startPerf) {
            // Seed the live timer with its real elapsed: streaming rebuilds
            // recreate the element constantly, so a hard-coded "0.0s" would
            // keep flashing back to zero instead of counting up.
            label += "<span class='live-timer' data-start='" + item.startPerf + "'>" + fmtLive(performance.now() - item.startPerf) + "</span>";
          }
          var ltd = aggregateTurnDiff(state.items, item.turn);
          if (ltd && (ltd.added || ltd.deleted)) label += " · " + diffChipHtml(ltd);
        }
        el.innerHTML = "<span>" + label + " —</span>";
        break;
      }
      case "turn-end": {
        el.className = "turn-summary";
        var dur = (typeof item.elapsed === "number" && isFinite(item.elapsed)) ? fmtDur(item.elapsed) : "--";
        var s = "<span class='check'>✓</span><span>第 " + item.turn + " 轮完成 · 用时 " + dur + "</span>";
        var td = item.totalDiff;
        if (td && (td.added || td.deleted)) {
          s += diffChipHtml(td);
        }
        el.innerHTML = s;
        if (td && td.files && td.files.length) {
          var det = document.createElement("details");
          det.className = "turn-diff";
          var dsum = document.createElement("summary");
          dsum.textContent = "文件改动明细";
          det.appendChild(dsum);
          td.files.forEach(function (f) {
            var row = document.createElement("div");
            row.className = "td-file";
            var nm = document.createElement("span");
            nm.className = "td-path";
            nm.textContent = f.path;
            nm.title = "点击在 VS Code 中打开";
            row.appendChild(nm);
            row.appendChild(diffChipEl(f, false));
            row.onclick = (function (p) { return function () { post({ type: "openFile", path: p }); }; })(f.path);
            det.appendChild(row);
          });
          el.appendChild(det);
        }
        break;
      }
      case "user": {
        el.className = "msg user";
        if (item.editing) {
          var ta = document.createElement("textarea");
          ta.className = "edit-box";
          ta.value = item.text;
          var act = document.createElement("div");
          act.className = "msg-actions";
          var save = document.createElement("button");
          save.textContent = "保存（打断生效）";
          var cancel = document.createElement("button");
          cancel.textContent = "取消";
          act.appendChild(save);
          act.appendChild(cancel);
          var body = document.createElement("div");
          body.className = "body";
          body.style.maxWidth = "92%";
          body.appendChild(ta);
          body.appendChild(act);
          el.appendChild(body);
          save.onclick = function () {
            var v = ta.value.trim();
            if (!v) return;
            item.editing = false;
            item.text = v;
            post({ type: "send", text: v, mode: "steer" });
            scheduleRender();
          };
          cancel.onclick = function () { item.editing = false; scheduleRender(); };
          ta.addEventListener("keydown", function (e) {
            if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); save.onclick(); }
          });
          setTimeout(function () { ta.focus(); ta.select(); }, 0);
        } else {
          var ub = document.createElement("div");
          ub.className = "body";
          ub.innerHTML = renderInline(item.text);
          el.appendChild(ub);
          var ua = document.createElement("div");
          ua.className = "msg-actions";
          if (item.turn === state.lastTurn && state.running) {
            var ed = document.createElement("button");
            ed.textContent = "✎ 编辑";
            ed.onclick = function () { item.editing = true; scheduleRender(); };
            ua.appendChild(ed);
          }
          var cp = document.createElement("button");
          cp.textContent = "⧉ 复制";
          cp.onclick = function () { post({ type: "copyText", text: item.text }); };
          ua.appendChild(cp);
          el.appendChild(ua);
        }
        break;
      }
      case "assistant": {
        el.className = "msg assistant";
        var html = "";
        // Fold state is keyed by the reasoning block's stable ordinal (the
        // Nth "思考"), NOT the blocks-array index — streaming rebuilds can
        // reorder/shift block indices, which previously lost the state on the
        // third toggle. Collapsed by default; every click is honored.
        var riSeq = 0, bidx = 0;
        item.blocks.forEach(function (b, bi) {
          if (b.type === "reasoning") {
            var mySeq = riSeq++;
            var rOpen = !!(item.reasoningOpen && item.reasoningOpen[mySeq]);
            html += "<div class='reasoning' data-ri='" + mySeq + "'><div class='reasoning-head' data-ri='" + mySeq + "'>" +
                    (rOpen ? "▾" : "▸") + " 思考</div>" +
                    "<div class='reasoning-body'" + (rOpen ? "" : " hidden") + "><pre>" + esc(b.text) + "</pre></div></div>";
          } else {
            html += "<div class='body' data-bidx='" + bidx + "'>" + renderText(b.text) + (item.streaming ? "<span class='stream-cursor'></span>" : "") + "</div>";
            bidx++;
          }
        });
        if (item.blocks.length === 0 && item.streaming) html = "<div class='body'><span class='stream-cursor'></span></div>";
        el.innerHTML = html;
        // Live timer for the assistant's reply round (only while it is the
        // newest round; gone as soon as the message completes). Seeded with
        // the real elapsed so dense streaming rebuilds never flash it back
        // to "0.0s".
        if (item.streaming && state.activeRound && state.activeRound.kind === "assistant") {
          var lt = document.createElement("span");
          lt.className = "live-timer";
          lt.dataset.start = String(item.startPerf || 0);
          lt.textContent = item.startPerf ? fmtLive(performance.now() - item.startPerf) : fmtLive(0);
          el.appendChild(lt);
        }
        if (!item.streaming && item.blocks.some(function (b) { return b.type === "text"; })) {
          var aa = document.createElement("div");
          aa.className = "msg-actions";
          var acp = document.createElement("button");
          acp.textContent = "⧉ 复制";
          acp.onclick = function () {
            var all = item.blocks.filter(function (b) { return b.type === "text"; }).map(function (b) { return b.text; }).join("\n");
            post({ type: "copyText", text: all });
          };
          aa.appendChild(acp);
          el.appendChild(aa);
        }
        break;
      }
      case "tool": {
        // Collapsible tool call — collapsed by default (the user opens it by
        // clicking); summary row shows status + "⚙ name : <summary>". The
        // bundle (tool-group) wraps consecutive tool calls.
        var det = document.createElement("details");
        det.className = "tool";
        var dot = item.status === "running" ? "run" : item.status === "error" ? "err" : "ok";
        var sum = document.createElement("summary");
        var d = document.createElement("span");
        d.className = "dot " + dot;
        var nm = document.createElement("span");
        nm.className = "tname";
        var tsum = toolSummaryText(item);
        nm.setAttribute("data-name", item.name);
        nm.textContent = "⚙ " + item.name + (tsum ? " : " + tsum : "");
        sum.appendChild(d);
        sum.appendChild(nm);
        // "+N-M" line counts — on the fold row, so they stay visible while
        // the card is collapsed; pops when the count changes live.

        // newest one; removed once the result lands).
        if (item.status === "running" && state.activeRound && state.activeRound.kind === "tool" && state.activeRound.callId === item.callId) {
          var tlt = document.createElement("span");
          tlt.className = "live-timer";
          tlt.dataset.start = String(item.startedPerf || 0);

          sum.appendChild(tlt);
        }

        if (item.argsText) det.appendChild(toolBlock("参数", item.argsText));
        if (item.resultText) det.appendChild(toolBlock("结果", item.resultText));
        el.appendChild(det);
        break;
      }
      case "cmd": {
        el.className = item.err ? "sys-err" : "cmd-note";
        el.textContent = item.text;
        break;
      }
      case "error": {
        el.className = "sys-err";
        el.textContent = item.text;
        break;
      }
      default:

        el.textContent = JSON.stringify(item);

  }

  /* ---------- reasoning fold: plain div pair (no <details>), one delegated
     click handler. Fold state is keyed by the reasoning ordinal, so it
     survives the in-place streaming updates below. ---------- */
  messagesEl.addEventListener("click", function (ev) {
    var t = ev.target;
    if (!t || !t.closest) return;
    var head = t.closest(".reasoning-head");
    if (!head) return;
    var box = head.closest(".reasoning");
    if (!box) return;
    var body = box.querySelector(".reasoning-body");
    if (!body) return;
    var host = box.closest(".msg.assistant");
    if (!host) return;
    var wasHidden = body.hidden;
    body.hidden = !wasHidden;
    head.textContent = (wasHidden ? "▾" : "▸") + " 思考";
    var key = host.getAttribute("data-key");
    var ri = parseInt(head.getAttribute("data-ri") || "0", 10);
    for (var i = 0; i < state.items.length; i++) {
      var it = state.items[i];
      if (it.kind === "assistant" && String(it.id) === key) {
        if (!it.reasoningOpen) it.reasoningOpen = {};
        it.reasoningOpen[ri] = wasHidden;
        break;
      }
    }
  });

  /* ---------- block-level copy: one delegated listener for every
     .block-copy button (markdown code blocks + tool args/result) ---------- */
  messagesEl.addEventListener("click", function (ev) {
    var btn = ev.target && ev.target.closest ? ev.target.closest(".block-copy") : null;
    if (!btn) return;
    var pre = btn.closest("pre") || btn.parentElement && btn.parentElement.querySelector("pre");
    var text = pre ? pre.textContent.replace(/⧉ 复制$/, "").trim() : "";
    if (text) {
      post({ type: "copyText", text: text });
      var old = btn.textContent;
      btn.textContent = "✓ 已复制";
      setTimeout(function () { btn.textContent = old; }, 1200);
    }
  });

  /* ---------- pending-send queue rows (session/queue snapshot) ---------- */
  function renderQueue() {
    queueEl.innerHTML = "";
    if (!state.queue.length) { queueEl.hidden = true; return; }
    queueEl.hidden = false;
    state.queue.forEach(function (it) {
      var row = document.createElement("div");
      row.className = "q-item";
      var tag = document.createElement("span");
      tag.className = "qtag";
      tag.textContent = it.placement === "steering" ? "插入中" : it.placement === "context" ? "上下文" : "排队";
      var txt = document.createElement("span");
      txt.className = "qtext";
      txt.textContent = it.text || "(图片)";
      txt.title = it.text;
      row.appendChild(tag);
      row.appendChild(txt);
      var qbtn = function (label, title, fn, danger) {
        var b = document.createElement("button");
        b.className = "qbtn" + (danger ? " danger" : "");
        b.textContent = label;
        b.title = title;
        b.onclick = fn;
        return b;
      };
      row.appendChild(qbtn("copy", "复制", function () { post({ type: "copyText", text: it.text }); }));
      if (it.placement === "queued") {
        row.appendChild(qbtn("steer", "在下一个 LLM 回复后插入（打断）", function () { post({ type: "queueSteer", itemId: it.id }); }));
        row.appendChild(qbtn("del", "撤回（从队列移除）", function () { post({ type: "queueRemove", itemId: it.id }); }, true));
      }
      queueEl.appendChild(row);
    });
  }

  /* ---------- task bar (todos projection) ---------- */
  var TODO_MARK = { pending: "○", in_progress: "●", completed: "✓" };
  function renderTodos() {
    var has = state.todos && state.todos.length > 0;
    todoBarEl.hidden = !has;
    if (!has) return;
    var active = state.todos.filter(function (t) { return t.status === "in_progress"; }).length;
    var done = state.todos.filter(function (t) { return t.status === "completed"; }).length;
    todoCountEl.innerHTML = (active ? "<b>" + active + " 进行中</b> · " : "") + done + "/" + state.todos.length;
    todoListEl.hidden = !state.todoOpen;
    todoChevronEl.textContent = state.todoOpen ? "▾" : "▸";
    if (!state.todoOpen) return;
    todoListEl.innerHTML = "";
    state.todos.forEach(function (t) {
      var li = document.createElement("li");
      li.className = "t-item " + t.status;
      var mark = document.createElement("span");
      mark.className = "tmark";
      mark.textContent = TODO_MARK[t.status] || "○";
      var txt = document.createElement("span");
      txt.className = "ttext";
      txt.textContent = t.content;
      txt.title = t.content;
      li.appendChild(mark);
      li.appendChild(txt);
      todoListEl.appendChild(li);
    });
  }

  /* ---------- protocol from host ---------- */
  window.addEventListener("message", function (event) {
    var msg = event.data;
    if (!msg || typeof msg !== "object") return;
    switch (msg.type) {
      case "state": {
        var wasConnected = state.connected;
        state.connected = msg.connected;
        state.version = msg.version;
        state.phase = msg.phase || (msg.connected ? "online" : "offline");
        state.sessions = msg.sessions || [];
        state.activeSessionId = msg.activeSessionId;
        // Transient errors (e.g. "harness 未连接" fired while booting) should
        // vanish once connectivity comes back.
        if (msg.connected && !wasConnected) {
          state.items = state.items.filter(function (it) { return it.kind !== "error"; });
        }
        if (state.activeSessionId && state.titles[state.activeSessionId] === undefined) {
          state.titles[state.activeSessionId] = undefined;
        }
        var act = (msg.sessions || []).find(function (x) { return x.sessionId === msg.activeSessionId; });
        state.usage = act && act.usage ? act.usage : null;
        // If the active session changed (or first state), reset the view to that session's cache
        if (msg.activeSessionId !== state.lastSessionId) {
          state.lastSessionId = msg.activeSessionId;
          state.items = []; state.seqs = new Set(); state.oldestSeq = Infinity;
          state.curAssistant = null; state.openBlocks = [];
          state.hasMore = false; state.loadingOlder = false;
          state.queue = []; renderQueue();
          state.todos = []; renderTodos();   // host re-pushes via todos message
          state.diffByCall = {}; state.activeRound = null; state.turnStartPerf = 0;
          suspended = false;
          forceBottom = true;
        }
        // Re-apply the latest known todos for the now-active session (host may
        // have sent the todos message before this state update landed).
        if (state.todoCache && state.todoCache.sessionId === state.activeSessionId) {
          state.todos = state.todoCache.items;
          renderTodos();
        }
        updateHeader();
        scheduleRender();
        break;
      }
      case "models": {
        state.models = msg;
        modelEl.innerHTML = "";
        if (msg.groups && msg.groups.length) {
          msg.groups.forEach(function (g) {
            var og = document.createElement("optgroup");
            og.label = g.name || g.id;
            g.models.forEach(function (m) {
              var o = document.createElement("option");
              o.value = g.id + "|" + m.id;
              o.textContent = m.name;
              og.appendChild(o);
            });
            modelEl.appendChild(og);
          });
          // Select the current model (append-then-set keeps this robust across
          // DOM implementations).
          if (msg.current && msg.current.provider && msg.current.model) {
            modelEl.value = msg.current.provider + "|" + msg.current.model;
          }
          modelEl.hidden = false;
        } else {
          modelEl.hidden = true;
        }
        renderEffortSelect();
        break;
      }
      case "permissions": {
        state.presets = msg.options || [];
        state.permCurrent = msg.current;
        renderPresetSelect();
        break;
      }
      case "interaction": {
        renderInteraction(msg);
        break;
      }
      case "interactionSettled": {
        if (state.interact && state.interact.rpcId === msg.rpcId) {
          state.interact = null;
          interactEl.hidden = true;
          interactState = null;
          unlockMainInput();
        }
        break;
      }
      case "history": {
        if (msg.sessionId !== state.activeSessionId) return;
        state.hasMore = !!msg.hasMore;
        state.loadingOlder = false;
        // Bridge-computed per-call "+N-M" diffs for this page.
        var pageDiffs = msg.toolDiffs || {};
        if (msg.isOlder) {
          // Merge this page's per-call diffs BEFORE folding events, so the
          // tool items pick up their "+N-M" while being mapped.
          for (var pk in pageDiffs) {
            if (Object.prototype.hasOwnProperty.call(pageDiffs, pk)) state.diffByCall[pk] = pageDiffs[pk];
          }
          // Infinite-scroll prepend: older page = complete messages already in
          // the log, so map them straight to read-only items (no streaming
          // state) and insert ABOVE the current list, keeping the anchor.
          var before = olderItemsFrom(msg.events || []);
          var newCount = before.length;
          if (newCount > 0) {
            var h0 = messagesEl.scrollHeight;
            state.items = before.concat(state.items);
            // Advance the paging cursor to the newest seq of the new page.
            var newOldest = Infinity;
            (msg.events || []).forEach(function (ev) {
              if (ev && typeof ev.seq === "number" && ev.seq < newOldest) newOldest = ev.seq;
            });
            if (newOldest !== Infinity) state.oldestSeq = newOldest;
            // The prepend must land even while the view is frozen mid-run: a
            // plain render() would hit the `suspended` gate and return without
            // touching the DOM, which locked history loading under running
            // turns. Sync the list directly, then restore the freeze.
            var prevSusp = suspended;
            suspended = false;
            forceBottom = false;
            try { syncItems(); } finally { suspended = prevSusp; }
            if (sentinelEl) {
              sentinelEl.style.display = state.hasMore ? "block" : "none";
              if (messagesEl.firstChild !== sentinelEl) messagesEl.insertBefore(sentinelEl, messagesEl.firstChild);
            }
            // Compensate: keep the same content under the viewport.
            messagesEl.scrollTop += messagesEl.scrollHeight - h0;
          }
          break;
        }
        // Non-older history (initial load / session switch / send-time
        // refresh). RACE FIX: when the live turn is ALREADY streaming
        // (state.running), do NOT wipe state.items — send() triggers a
        // refresh right after prompt(), and its history tail may lag behind
        // the live stream; clearing here would destroy the in-flight
        // assistant items and the reply would render truncated/missing.
        // Merge incrementally instead: applyEvent dedupes by seq, so only
        // events not yet seen are folded in. Full reset is kept for the
        // non-streaming cases (initial load, session switch).
        if (!state.running) {
          state.items = []; state.seqs = new Set(); state.oldestSeq = Infinity;
          state.curAssistant = null; state.openBlocks = [];
          state.diffByCall = {}; state.activeRound = null; state.turnStartPerf = 0;
          state.dirtySync = false;
        }
        // NOTE: do NOT clear state.queue here — send() triggers a history
        // reload right after a queue prompt, and wiping the queue here would
        // race the session/queue frame and hide the pending rows.
        suspended = false;
        forceBottom = true;
        for (var pk2 in pageDiffs) {
          if (Object.prototype.hasOwnProperty.call(pageDiffs, pk2)) state.diffByCall[pk2] = pageDiffs[pk2];
        }
        (msg.events || []).forEach(applyEvent);
        scheduleRender();
        break;
      }
      case "event": {
        if (msg.sessionId !== state.activeSessionId) return;
        applyEvent(msg.event);
        break;
      }
      case "running": {
        if (msg.sessionId === state.activeSessionId) {
          var wasRunning = state.running;
          state.running = msg.running;
          if (wasRunning && !msg.running) {
            softEndTurn();
            // The turn just ended: release any render freeze (the user may
            // have been reading history mid-turn) so the final state — all
            // live timers removed — actually reaches the DOM. Without this,
            // scheduleRender stays swallowed by `suspended` forever and the
            // frozen DOM keeps a ticking timer that nothing ever clears.
            if (suspended) {
              suspended = false;
              scheduleRender();
            }
          }
          updateHeader();
        }
        break;
      }
      case "queue": {
        if (msg.sessionId !== state.activeSessionId) return;
        state.queue = msg.items || [];
        renderQueue();
        break;
      }
      case "todos": {
        state.todoCache = { sessionId: msg.sessionId, items: msg.items || [] };
        if (msg.sessionId !== state.activeSessionId) return;
        state.todos = msg.items || [];
        renderTodos();
        break;
      }
      case "toolDiff": {
        if (msg.sessionId !== state.activeSessionId) return;
        state.diffByCall[msg.callId] = { added: msg.added, deleted: msg.deleted, path: msg.path };
        var tool = findTool(msg.callId);
        if (tool) {
          var changed = !tool.diff || tool.diff.added !== msg.added || tool.diff.deleted !== msg.deleted;
          tool.diff = { added: msg.added, deleted: msg.deleted, path: msg.path };
          if (changed) tool.diffPop = true;
          tool.version = (tool.version || 0) + 1;
          scheduleRender();
        }

  /* ---------- @ mention: drill-down directory menu above the input ---------- */

  /* ---------- / command picker (real catalog from commands/list) ---------- */
  var SLASH_COMMANDS = [

  function slashMatch(value) {

  function updateHeader() {

  /* ---------- interaction card (approval / question from the agent) ---------- */
  var interactState = null; // {kind, rpcId, sessionId, approvalId?, selections: {qid:Set}, custom: string}
  var inputRowEl = $("input-row");

  // Split the conventional recommendation suffix WITHOUT changing the answer
